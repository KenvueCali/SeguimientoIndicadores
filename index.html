   }).join('')+'</table></div>';
  const heat=nf?`<div style="overflow-x:auto"><table class="hm"><tr><th></th>${G.fechas.map(f=>`<th>${f.slice(8)}/${f.slice(5,7)}</th>`).join('')}</tr>`
   +P.map((p,j)=>{const m={};p.dias.forEach(d=>m[d.fecha]=d);return `<tr><td class="nm">${j+1}. ${esc(corto(p.nombre))}</td>${G.fechas.map(f=>{const d=m[f];return d?`<td style="background:rgba(14,143,131,${(0.12+0.88*d.ok/d.total).toFixed(2)});${d.ok===d.total?'outline:2px solid '+GOLD+';':''}" title="${esc(p.nombre)} · ${f}: ${d.ok} de ${d.total} · ${d.pts} pts">${d.ok}</td>`:'<td style="background:var(--line)" title="Sin registros">·</td>'}).join('')}</tr>`}).join('')+'</table></div><p class="mute" style="margin:8px 0 0">Número = indicadores cumplidos ese día. Más oscuro = más cumplimiento. Borde dorado = día perfecto. Gris = sin registros.</p>':'<p class="mute">Aún no hay días cargados este mes.</p>';
  const p=P.find(x=>x.cedula===selP),pos=P.indexOf(p)+1,dm={};p.dias.forEach(d=>dm[d.fecha]=d);
  const pIndInd = ord.reduce((acc, k) => acc + ip(p, k), 0);
  const misInfoInd = getMisionesUsuarioPorNombre(p.nombre, p.cedula);
  const pMisInd = p.pts_misiones != null ? Number(p.pts_misiones) : misInfoInd.puntos;
  const cantMisInd = p.misiones_ok != null ? Number(p.misiones_ok) : misInfoInd.cantidad;

  const W=620,Hh=170,bw=Math.max(4,Math.min(26,(W-40)/Math.max(1,nf)-3)),stp=(W-40)/Math.max(1,nf);let acc=0;const tot=Math.max(1,p.puntos-p.pts_post-pMisInd);
  const sv=G.fechas.map((f,i)=>{const d=dm[f],x=30+i*stp,h=d?d.pts/Math.max(1,perfect)*(Hh-40):0;return `<rect x="${x}" y="${Hh-20-h}" width="${bw}" height="${Math.max(h,d?2:0)}" rx="2" fill="${d&&d.ok===d.total?GOLD:'#0e8f83'}"><title>${f}: ${d?d.pts+' pts · '+d.ok+' de '+d.total:'sin registros'}</title></rect><text x="${x+bw/2}" y="${Hh-6}" font-size="8" text-anchor="middle" fill="currentColor" opacity=".6">${f.slice(8)}</text>`}).join('');
  const pts=G.fechas.map((f,i)=>{acc+=dm[f]?dm[f].pts:0;return `${(30+i*stp+bw/2).toFixed(1)},${(Hh-20-acc/tot*(Hh-40)).toFixed(1)}`}).join(' ');
  const dd=p.dias,perf=dd.filter(d=>d.ok===d.total).length,mejor=dd.reduce((a,d)=>Math.max(a,d.pts),0),okT=dd.reduce((a,d)=>a+d.ok,0),tT=dd.reduce((a,d)=>a+d.total,0);
  const det=`<div class="row row2" style="max-width:420px"><label for="sel-persona-det">Persona</label><select id="sel-persona-det" onchange="selP=this.value;drawAdmin()">${P.map((x,j)=>`<option value="${x.cedula}" ${x.cedula===selP?'selected':''}>${j+1}. ${esc(x.nombre)}</option>`).join('')}</select></div>
   <div class="dt"><div><b>${pos} de ${P.length}</b>Puesto actual</div><div><b>${p.puntos} pts</b>Total · Ind: ${pIndInd} · Mis: ${pMisInd}</div><div><b>${tT?Math.round(okT/tT*100):0}%</b>Indicadores cumplidos</div><div><b>${perf}</b>Días perfectos · mejor día ${mejor} pts</div></div>
   <p class="mute" style="margin:0 0 4px"><b style="color:var(--ink)">Cómo llegó a ${p.puntos} puntos</b></p>
   ${ord.map(k=>{const x=p.por_indicador[k],r=x.dias_total?x.dias_ok/x.dias_total*100:0;return `<div class="cmpb"><span>${esc(x.nombre)}</span><span class="tr"><i style="width:${r}%;background:${col(k)}"></i></span><span>${x.dias_ok} de ${x.dias_total} días × ${x.puntos} = <b>${ip(p,k)}</b></span></div>`}).join('')}
   <div class="cmpb"><span>🚀 Misiones</span><span class="tr"><i style="width:${pMisInd?100:0}%;background:${MIS_COL}"></i></span><span>${cantMisInd} ${cantMisInd===1?'misión validada':'misiones validadas'} = <b>${pMisInd} pts</b></span></div>
   <div class="cmpb"><span>🌟 Atenciones increíbles</span><span class="tr"><i style="width:${p.aprobadas?100:0}%;background:${GOLD}"></i></span><span>${p.aprobadas} aprobadas × ${PTS_INCREIBLE} = <b>${p.pts_post}</b>${p.pendientes?` · ${p.pendientes} en revisión`:''}${p.con_feedback?` · ${p.con_feedback} con feedback`:''}</span></div>
   <p class="mute" style="margin:14px 0 4px"><b style="color:var(--ink)">Puntos por día</b> (barra dorada = día perfecto; línea = acumulado)</p>
   <svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto;color:var(--ink)" role="img" aria-label="Puntos por día y acumulado"><line x1="26" y1="${Hh-20}" x2="${W-6}" y2="${Hh-20}" stroke="var(--line)"/>${sv}${nf?`<polyline points="${pts}" fill="none" stroke="${'#d6543f'}" stroke-width="2"/>`:''}</svg>`;
  return `${filtroBar}${ex}
  <div class="card"><b>Cómo se compone el puntaje de cada persona</b>${leg}${bars}</div>
  <div class="card"><b>Detalle por persona (Indicadores vs. Misiones)</b><p class="mute" style="margin:2px 0 8px">Comparativo directo de puntos por indicadores, puntos por misiones y atenciones increíbles.</p>${tabla}</div>
  <div class="card"><b>Mapa de cumplimiento por día</b><p class="mute" style="margin:2px 0 8px">Quién cumplió cuántos indicadores cada día del mes.</p>${heat}</div>
  <div class="card"><b>Análisis individual</b>${det}</div>`;
}
let popOpen=false;
const perfectDay=()=>((D && D.indicadores) || []).reduce((a,x)=>a+x.puntos,0);
function ritmo(){const d=(H&&H.dias)||[];return d.length?d.reduce((a,x)=>a+x.puntos,0)/d.length:0}
function mision(){
  const pd=perfectDay(),n=((D && D.indicadores) || []).length;
  return `<div class="card mis"><h3>🎯 Tu misión de hoy</h3><p>Hoy puedes sumar hasta <b>${pd+PTS_INCREIBLE} pts</b>: <b>${pd}</b> cumpliendo tus ${n} indicadores y <b>${PTS_INCREIBLE} más</b> si una atención tuya es aprobada como increíble.</p>
  <div class="chips">${((D && D.indicadores) || []).map(i=>`<span class="chip">${esc(i.nombre)} +${i.puntos}</span>`).join('')}<span class="chip g">Atención increíble +${PTS_INCREIBLE}</span></div>
  <div class="btns"><button type="button" data-user-action="post">✨ Postular una atención</button><button type="button" class="sec" data-user-action="help">💡 ¿Cómo funciona?</button></div></div>`;
}
function incCards(pts){
  const inc=((D && D.incentivos) || []).map(enrichIncentivo).slice().sort((a,b)=>(a.tipo_meta==='indicador'?1:0)-(b.tipo_meta==='indicador'?1:0)||(a.meta-b.meta));
  const pd=perfectDay(),r=ritmo();
  if(!inc.length)return '<p class="mute">Aún no hay premios a conseguir definidos para este mes.</p>';

  return inc.map(n=>{
    if(n.tipo_meta === 'indicador'){
      const val = getValidacionIncentivoUsuario(n.id, S.ced);
      const est = val ? val.estado : null;
      const validado = est === 'aprobada';
      const pendienteLider = est === 'pendiente';
      const rechazada = est === 'rechazada';
      const rb = validado ? 'VALIDADO POR LÍDER 🏆' : pendienteLider ? 'EN VALIDACIÓN LÍDER ⏳' : 'META POR INDICADOR 🎯';

      return `<div class="card inc ${validado?'lg':''}"><span class="rb">${rb}</span>
      <div class="pr"><span class="gift">${validado?'🏆':'🎯'}</span><div><b>${esc(n.premio)}</b><span>${esc(n.nombre)} · Indicador: <b>${esc(n.indicador_nombre)}</b> · Meta: <b>${esc(n.meta_indicador)}</b></span></div></div>
      <div class="lider-box">
        <div><b>🕒 Cierre / Corte del indicador:</b> ${esc(n.corte_indicador || 'Cierre de mes')}</div>
        <div class="mute" style="margin-top:3px">Este incentivo se valida con tu líder al cierre o corte del indicador.</div>
        ${validado
          ? `<div class="row" style="margin-top:8px">
               <span class="ok">✔ Cierre/corte validado por el líder${val && val.nota_lider ? ' · ' + esc(val.nota_lider) : ''}</span>
               <button type="button" class="gold" onclick='copiarImagenLogro(${jsArg(n.nombre)}, 0, "🏆", ${jsArg(n.premio)}, ${jsArg("Premio validado por indicador (" + (n.indicador_nombre||"") + " · " + (n.corte_indicador||"") + "):")})'>📤 Compartir imagen de logro</button>
             </div>`
          : pendienteLider
            ? `<div style="margin-top:8px"><span class="tag pendiente">⏳ Solicitud enviada · Esperando validación del líder en ${esc(n.corte_indicador)}</span></div>`
            : `<div style="margin-top:8px">
                 ${rechazada ? `<div class="err" style="min-height:0;margin-bottom:6px">Observación del líder: ${esc((val && val.nota_lider) || 'Revisa el resultado del corte/cierre.')}</div>` : ''}
                 <label for="val-inc-nota-${n.id}" style="font-size:.85rem">Resultado o evidencia</label>
                 <input id="val-inc-nota-${n.id}" placeholder="Opcional: resultado del cierre/corte o enlace de evidencia">
                 <button type="button" onclick='solicitarValidacionIncentivo(${Number(n.id)}, ${jsArg(n.nombre)}, ${jsArg(n.corte_indicador)})'>✔ Solicitar validación de cierre/corte con el líder</button>
               </div>`
        }
      </div></div>`;
    }

    const pct=Math.min(100,Math.round(pts/Math.max(1,n.meta)*100)),falta=n.meta-pts,ok=falta<=0,cerca=!ok&&pct>=80;
    const rb=ok?'¡META ALCANZADA! 🏆':cerca?'¡CASI LO TIENES! 🔥':'PREMIO A CONSEGUIR ✨';
    let how='';
    if(!ok&&pd){
      const dp=Math.ceil(falta/pd),dp2=Math.ceil(Math.max(0,falta-PTS_INCREIBLE)/pd),pl=k=>k===1?'':'s';
      how=`<div class="how"><b>🧭 ¿Cómo lo puedes conseguir?</b><ul>`
      +(falta<=PTS_INCREIBLE?`<li>¡Una sola <b>atención increíble aprobada</b> (+${PTS_INCREIBLE} pts) te lleva a la meta!</li>`:`<li><b>${dp} día${pl(dp)} perfecto${pl(dp)}</b>, cumpliendo todos los indicadores (${pd} pts por día).</li><li>O <b>1 atención increíble aprobada</b> (+${PTS_INCREIBLE}) más <b>${dp2} día${pl(dp2)} perfecto${pl(dp2)}</b>.</li>`)
      +(r>0?`<li>A tu ritmo actual (${r.toFixed(1)} pts por día) alcanzarías la meta en unos <b>${fmtDias(Math.ceil(falta/r))} con registro</b>.</li>`:'')+`</ul></div>`;
    }
    return `<div class="card inc ${ok?'lg':cerca?'cerca':''}"><span class="rb">${rb}</span>
    <div class="pr"><span class="gift">${ok?'🏆':'🎁'}</span><div><b>${esc(n.premio)}</b><span>${esc(n.nombre)} · meta ${n.meta} pts</span></div></div>
    <div class="nums"><div>${ok?'<span class="big">¡Meta alcanzada!</span>':`<span class="big">${falta}</span> <span class="mute">pts para alcanzarlo</span>`}</div><b>${pct}%</b></div>
    <div class="track ${ok?'ok':''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <span class="mute">Llevas ${pts} de ${n.meta} puntos${ok?'. ¡Felicitaciones!':''}</span>${how}</div>`;
  }).join('');
}
function misInd(){
  const d=(H&&H.dias)||[],st={};
  d.forEach(x=>x.indicadores.forEach(i=>{const q=st[i.nombre]=st[i.nombre]||{ok:0,t:0};q.t++;if(i.cumplido)q.ok++}));
  const rows=((D && D.indicadores) || []).map(i=>{const q=st[i.nombre]||{ok:0,t:0};return{...i,ok:q.ok,t:q.t,perd:(q.t-q.ok)*i.puntos}});
  const opp=rows.filter(x=>x.perd>0).sort((a,b)=>b.perd-a.perd)[0];
  return rows.map(x=>{const p=x.t?Math.round(x.ok/x.t*100):0;return `<div class="card ib"><div class="tp"><span><b>${esc(x.nombre)}</b> <span class="mute">· ${x.puntos} pts por día cumplido</span></span><b>${x.dias*x.puntos} pts</b></div><div class="tr" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%;background:${p>=80?'var(--teal)':p>=50?'var(--gold)':'var(--coral)'}"></i></div><span class="mute">${x.t?`Lo cumpliste ${x.ok} de ${fmtDias(x.t)} (${p}%)`:'Aún sin registros este mes'}</span></div>`}).join('')
  +(opp?`<div class="card opp"><b>💎 Tu mayor oportunidad: ${esc(opp.nombre)}</b><br><span>Este mes dejaste de sumar <b>${opp.perd} pts</b> aquí (${fmtDias(opp.t-opp.ok)} sin cumplir × ${opp.puntos} pts). Cumplirlo cada día es el camino más rápido para subir.</span></div>`:'');
}

function popHide(){const e=document.getElementById('pop');if(e)e.remove();const o=document.getElementById('ov'),d=document.getElementById('dw');if(o)o.remove();if(d)d.remove();popOpen=false}
function popShow(){
  popHide();if(!D||S.a)return;
  const inds = Array.isArray(D.indicadores) ? D.indicadores : [];
  const posts = Array.isArray(D.postulaciones) ? D.postulaciones : [];
  const perfect=inds.reduce((a,x)=>a+x.puntos,0),aprob=posts.filter(p=>p.estado==='aprobada').length,teaser=!sessionStorage.getItem('pz');
  const w=document.createElement('div');w.id='pop';
  w.innerHTML=`${teaser?`<div class="tz" id="tz"><button type="button" class="x" aria-label="Cerrar aviso" onclick="popTz()">×</button><b>🏅 ¡Suma ${PTS_INCREIBLE} pts extra!</b><br>Registra una atención increíble y, si la aprueban, sube en el ranking.<br><button type="button" onclick="popOpenF()">Ver cómo</button></div>`:''}<button type="button" class="tab" onclick="popOpenF()" aria-label="Abrir: cómo sumo puntos">💡 ¿Cómo sumo puntos?</button>`;
  const o=document.createElement('div');o.id='ov';o.className='ov';o.onclick=popClose;
  const d=document.createElement('aside');d.id='dw';d.className='dw';d.setAttribute('role','dialog');d.setAttribute('aria-label','Cómo sumar puntos');
  d.innerHTML=`<button type="button" class="cl" aria-label="Cerrar" onclick="popClose()">×</button><h2>¡Tú decides cuánto sumas! 🚀</h2><p class="mute" style="margin:0">Cada día es una nueva oportunidad de subir en el ranking.</p>
  <div class="stp"><span class="no2">1</span><div><b>Cumple tus indicadores</b><ul>${inds.map(i=>`<li>${esc(i.nombre)}: <b>+${i.puntos} pts</b> por día cumplido</li>`).join('')}</ul></div></div>
  <div class="stp"><span class="no2">2</span><div><b>Registra tus interacciones destacadas</b><br><span class="mute">Cuando tengas una atención de la que te sientas orgulloso, postúlala con el número de caso y cuenta qué pasó y por qué fue excepcional.</span></div></div>
  <div class="stp g"><span class="no2">3</span><div><b>Si la aprueban como gran gestión: +${PTS_INCREIBLE} pts 🏅</b><br><span class="mute">Una atención increíble aprobada suma ${PTS_INCREIBLE} puntos directos a tu ranking del mes. Si no se aprueba, recibes feedback y un compromiso de mejora: aprendes y puedes volver a postular.</span></div></div>
  <div class="ex"><b>Un ejemplo:</b> un día perfecto suma ${perfect} pts. Si además una atención tuya es aprobada, ese día pesa <b>${perfect+PTS_INCREIBLE} pts</b> en tu ranking.${aprob?`<br>Ya tienes <b>${aprob}</b> ${aprob>1?'atenciones aprobadas':'atención aprobada'}, ¡sigue así!`:''}</div>
  <p style="margin:16px 0 0"><button type="button" onclick="popPost()">✨ Postular una atención ahora</button></p>`;
  document.body.append(w,o,d);
}
function popTz(){sessionStorage.setItem('pz','1');const t=document.getElementById('tz');if(t)t.remove()}
function popOpenF(){popTz();popOpen=true;document.getElementById('ov').classList.add('on');const d=document.getElementById('dw');d.classList.add('on');d.querySelector('.cl').focus()}
function popClose(){popOpen=false;const o=document.getElementById('ov'),d=document.getElementById('dw');if(o)o.classList.remove('on');if(d)d.classList.remove('on')}
function popPost(){popClose();userTab='resultados';drawUser();const h=document.getElementById('postular');if(h)h.scrollIntoView({behavior:'smooth'});setTimeout(()=>{const n=document.getElementById('nc');if(n)n.focus()},500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&popOpen)popClose()});

document.addEventListener('click', e => {
  const userTabBtn = e.target.closest('button[data-user-tab]');
  if(userTabBtn && S && !S.a){
    const target = userTabBtn.getAttribute('data-user-tab');
    if(target){
      setUserTab(target);
      return;
    }
  }

  const rkBtn = e.target.closest('button[data-rk]');
  if(rkBtn && S && !S.a){
    setVistaRk(rkBtn.getAttribute('data-rk'));
    return;
  }

  const negBtn = e.target.closest('button[data-neg]');
  if(negBtn && S && !S.a){
    setVistaNeg(negBtn.getAttribute('data-neg'));
    return;
  }

  const actBtn = e.target.closest('button[data-user-action]');
  if(actBtn && S && !S.a){
    const act = actBtn.getAttribute('data-user-action');
    if(act === 'post') popPost();
    else if(act === 'help') popOpenF();
    return;
  }

  const adminBtn = e.target.closest('button[data-action="admin-tab"]');
  if(adminBtn && S && S.a){
    const target = adminBtn.getAttribute('data-tab');
    if(target && target !== tab){
      bellOpen = false;
      editIndId = null;
      editIncId = null;
      editUsrCed = null;
      tab = target;
      drawAdmin();
    }
  }
});

async function g(fn,args){
  try{
    await rpc(fn,{p_admin:S.clave,...args});
    await syncState({ silent: false, allowNotif: false });
  }catch(e){alert(e.message)}
}
const del=(t,id)=>confirm('¿Borrar? No se puede deshacer.')&&g('admin_borrar',{p_tabla:t,p_id:String(id)});
async function evaluar(id,ok,ced='',caso=''){
  await g('admin_evaluar',{p_id:id,p_ok:ok,p_puntos:PTS_INCREIBLE,p_feedback:$('#f'+id).value,p_compromiso:$('#c'+id).value});
  broadcastEvent('validacion_resuelta', {
    cedula: ced, aprobada: ok,
    mensaje: ok ? `¡Tu caso ${caso} fue aprobado (+${PTS_INCREIBLE} pts)!` : `Recibiste feedback en el caso ${caso}.`
  });
}
async function lote(){
  const dup=F&&F.fechas.find(x=>x.fecha===$('#fe').value);
  if(dup&&!confirm(fdl(dup.fecha)+' ya tiene '+dup.registros+' registros cargados. ¿Quieres reemplazarlos con estos?'))return;
  const datos=$('#lt').value.split('\n').map(l=>l.split(',').map(s=>s.trim())).filter(a=>a.length>=3)
    .map(a=>({
      cedula:a[0], indicador:a[1], cumplido:a[2]==='1',
      promotores:a[3]!==undefined && a[3]!=='' ? +a[3] : null,
      detractores:a[4]!==undefined && a[4]!=='' ? +a[4] : null
    }));
  try{const n=await rpc('admin_lote',{p_admin:S.clave,p_fecha:$('#fe').value,p_datos:datos});await syncState({silent:false,allowNotif:false});tab='dia';drawAdmin();$('#lm').textContent=n+' registros guardados'}catch(e){alert(e.message)}
}

Object.assign(window, {
  out, drawUser, drawAdmin, syncState, playTone, notify,
  setUserTab, setVistaRk, setVistaNeg,
  aceptarMision, omitirMision, marcarMisionCompletada, copiarImagenLogro,
  reportarNegativo, postular,
  editarInd, limpiarInd, guardarInd, toggleTipoMetaForm,
  editarInc, limpiarInc, guardarInc, solicitarValidacionIncentivo, validarIncentivoLider,
  guardarPuntosIncreible, editarPersona, cancelarEditarPersona, guardarPersona, cambiarEquipoPersona,
  toggleBell, irATabValidacion, toggleSelectorAlgunos, crearMision, aprobarMision, aprobarMisionDirecto,
  agregarOpcionConducta, borrarOpcionConducta, borrarFecha, avisoFecha,
  popTz, popOpenF, popClose, popPost, g, del, evaluar, lote
});

S?load():login();
