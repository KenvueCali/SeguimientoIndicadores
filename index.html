<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Ranking de indicadores</title>

<style>

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif;padding:16px}
main{max-width:760px;margin:0 auto}

.hero b{font-size:3.4rem;font-weight:800;display:block;line-height:1}

button.sec{background:transparent;color:var(--mute);border:1px solid var(--line)}

.sb{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:.9rem}

.card.gap{background:linear-gradient(135deg,rgba(14,143,131,.16),rgba(224,165,38,.2));border-color:var(--gold)}

.ib{display:grid;grid-template-columns:1fr;gap:4px;padding:12px 16px}
.ib .tp{display:flex;justify-content:space-between;gap:10px}
.ib .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}

#toast-box{position:fixed;top:16px;right:16px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:360px;width:calc(100vw - 32px)}

<script>
// ====== CONFIGURA ESTO (Supabase > Project Settings > API) ======
const URL_='https://ucpifysuxxgyiyahfkgg.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjcGlmeXN1eHhneWl5YWhma2dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MTA0NTQsImV4cCI6MjExMTE4NjQ1NH0.uYTSzRJ_hKwiovyTK-r6meRBnNCQeoKlIWADkM6ED6E';
// ================================================================

// ====== DEFINICIÓN DE EQUIPOS Y ASIGNACIONES EDITABLES ======
const EQUIPOS = {
  tradicional: ['andres reina', 'jefry betancur', 'nikol munoz', 'valentina delgado'],
  social: ['lorena cardenas', 'cristhian buenanos', 'diana melo', 'alexandra diaz', 'jerson ruiz', 'kenneth rodriguez', 'luisa cifuentes']
};
let ASIGNACIONES_EQ = JSON.parse(localStorage.getItem('eq_map') || '{}');

function norm(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
function getEquipo(nombre, cedula=''){
  if(cedula && ASIGNACIONES_EQ[String(cedula)]) return ASIGNACIONES_EQ[String(cedula)];
  const n = norm(nombre);
  if(n && ASIGNACIONES_EQ['nom:' + n]) return ASIGNACIONES_EQ['nom:' + n];
  if(EQUIPOS.tradicional.some(m => n.includes(m) || m.includes(n))) return 'tradicional';
  if(EQUIPOS.social.some(m => n.includes(m) || m.includes(n))) return 'social';
  return 'general';
}
function equipoLabel(eq){
  if(eq==='tradicional') return '<span class="tag eq-trad">Tradicional</span>';
  if(eq==='social') return '<span class="tag eq-soc">Social</span>';
  return '<span class="tag">Operación</span>';
}

// ====== SISTEMA DE SONIDO Y ALERTAS ======
let audioCtx = null;
function playTone(type='info'){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    if(!audioCtx) audioCtx = new Ctx();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const notes = type==='success' ? [523.25, 659.25, 783.99]
                : type==='alert'   ? [587.33, 880, 587.33, 880]
                : type==='warn'    ? [330, 261.63]
                : [440, 554.37];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type==='warn' ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.13);
      gain.gain.setValueAtTime(0.001, now + idx * 0.13);
      gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.13 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.13 + 0.24);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.13);
      osc.stop(now + idx * 0.13 + 0.25);
    });
  }catch(e){}
}

function notify(title, body, type='info', actionHtml=''){
  playTone(type);
  const box = document.getElementById('toast-box');
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='success'?'ok-t':type==='warn'?'warn-t':'');
  el.innerHTML = `<div><b>${esc(title)}</b><div style="font-size:.88rem;opacity:.92;margin-top:2px">${esc(body)}</div>${actionHtml}</div><button class="cls" aria-label="Cerrar" onclick="this.parentElement.remove()">×</button>`;
  box.appendChild(el);
  setTimeout(()=>{ if(el.parentElement) el.remove(); }, 9000);
}

const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=JSON.parse(sessionStorage.getItem('s')||'null'), D=null, H=null, F=null, G=null;
let MISIONES=[], NEGATIVOS=[];
let selP='', tab='post', userTab='resultados', msg='';
let vistaRk='equipo';
let vistaNeg='equipo';
let adminFiltroEq='global';
let editIndId=null, editIncId=null;
let hayActualizacion=false, pollTimer=null, lastSignature=null;

async function rpc(fn,body){
  const r=await fetch(`${URL_}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const tx=await r.text(); let j=null; try{j=tx?JSON.parse(tx):null}catch(e){j={message:tx}}
  if(!r.ok) throw new Error((j&&j.message)||'Error de conexión'); return j;
}

async function loadExtras(){
  try{
    MISIONES = await rpc('listar_misiones', S.a ? {p_admin:S.clave, p_ced:null} : {p_admin:null, p_ced:S.ced}) || [];
  }catch(e){ MISIONES = []; }
  try{
    NEGATIVOS = await rpc('listar_negativos', {}) || [];
  }catch(e){ NEGATIVOS = []; }
  try{
    const eqRows = await rpc('listar_equipos', {}) || [];
    eqRows.forEach(r => { if(r.cedula && r.equipo) ASIGNACIONES_EQ[String(r.cedula)] = r.equipo; });
    localStorage.setItem('eq_map', JSON.stringify(ASIGNACIONES_EQ));
  }catch(e){}
}

function buildSignature(d, h){
  const posts = (d.postulaciones||[]).map(p=>`${p.id}:${p.estado}`).join('|');
  const pend = (d.pendientes||[]).length;
  const upd = h && h.actualizado ? h.actualizado : '';
  const rk = (d.ranking||[]).map(r=>`${r.nombre}:${r.puntos}`).join('|');
  return `${upd}::${posts}::${pend}::${rk}`;
}

function checkChanges(prevD, newD, newH){
  if(!prevD) return;
  if(!S.a){
    const oldMap = {};
    (prevD.postulaciones||[]).forEach(p=>oldMap[p.id]=p.estado);
    (newD.postulaciones||[]).forEach(p=>{
      if(oldMap[p.id] && oldMap[p.id]==='pendiente' && p.estado!=='pendiente'){
        if(p.estado==='aprobada'){
          notify('🎉 ¡Postulación aprobada!', `Tu caso ${p.numero_caso||''} ganó +${p.puntos} puntos.`, 'success');
        }else{
          notify('💬 Respuesta a tu postulación', `Tienes nuevo feedback en el caso ${p.numero_caso||''}.`, 'info');
        }
      }
    });
  }else{
    if((newD.pendientes||[]).length > (prevD.pendientes||[]).length){
      notify('📩 Nueva postulación recibida', 'Un integrante envió una atención para revisión.', 'alert');
    }
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    if(!S) return;
    try{
      const nextD = S.a ? await rpc('admin_panel',{p_admin:S.clave}) : await rpc('mi_panel',{p_ced:S.ced,p_clave:S.clave});
      let nextH = null;
      if(!S.a){ try{ nextH = await rpc('mi_historial',{p_ced:S.ced,p_clave:S.clave}); }catch(e){} }
      const sig = buildSignature(nextD, nextH);
      if(lastSignature && sig !== lastSignature && !hayActualizacion){
        hayActualizacion = true;
        notify(
          '🔄 Actualización disponible',
          'Hay nuevos datos o respuestas en el sistema. Actualiza la página para verlos.',
          'alert',
          `<button class="gold" onclick="hayActualizacion=false;load()">Actualizar ahora</button>`
        );
        draw();
      }
    }catch(e){}
  }, 30000);
}

async function load(){
  const prevD = D;
  try{
    D=S.a?await rpc('admin_panel',{p_admin:S.clave}):await rpc('mi_panel',{p_ced:S.ced,p_clave:S.clave});
    if(S.a){
      try{F=await rpc('admin_fechas',{p_admin:S.clave})}catch(e){F=null}
      try{G=await rpc('admin_detalle',{p_admin:S.clave})}catch(e){G=null}
    }
    if(!S.a){
      try{H=await rpc('mi_historial',{p_ced:S.ced,p_clave:S.clave})}catch(e){H=null}
    }
    await loadExtras();
    checkChanges(prevD, D, H);
    lastSignature = buildSignature(D, H);
    hayActualizacion = false;
    sessionStorage.setItem('s',JSON.stringify(S));
    draw();
    startPolling();
  }catch(e){S=null;sessionStorage.removeItem('s');login(e.message)}
}
function login(err=''){
  if(pollTimer) clearInterval(pollTimer);
  popHide();app.className='';app.innerHTML=`<div class="card" style="margin-top:8vh"><h1>Ranking de indicadores</h1>
  <p class="mute">Ingresa con tu cédula y tu clave.</p>
  <label>Cédula<input id="c" inputmode="numeric" autocomplete="username"></label>
  <label>Clave<input id="k" type="password" autocomplete="current-password"></label>
  <p class="err">${esc(err)}</p><button id="go">Entrar</button>
  <button class="sec" id="adm" style="margin-left:6px">Soy administrador</button></div>`;
  $('#go').onclick=()=>{playTone('info');S={ced:$('#c').value.trim(),clave:$('#k').value};load()};
  $('#adm').onclick=()=>{playTone('info');S={a:1,clave:$('#k').value};load()};
}
function out(){if(pollTimer)clearInterval(pollTimer);S=null;D=null;lastSignature=null;sessionStorage.removeItem('s');login()}
function draw(){app.className=S.a?'':'wide';S.a?drawAdmin():drawUser();S.a?popHide():popShow()}

// ---------- Misiones y Retos (Usuario) ----------
function tiempoRestante(fechaLimite){
  if(!fechaLimite) return 'Sin límite definido';
  const diff = new Date(fechaLimite) - new Date();
  if(diff <= 0) return 'Tiempo finalizado';
  const hrs = Math.floor(diff / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  if(hrs >= 24) return `Disponible por ${Math.floor(hrs/24)}d ${hrs%24}h`;
  return `Disponible por ${hrs}h ${mins}m`;
}
function seccionRetosUsuario(){
  if(!MISIONES || !MISIONES.length) return '<div class="card"><p class="mute" style="margin:0">No hay misiones activas en este momento.</p></div>';
  return MISIONES.map(m => {
    const exp = m.fecha_limite && new Date(m.fecha_limite) < new Date();
    const completada = !!m.completada;
    return `<div class="card reto-card ${completada?'done':''}">
      <div class="row">
        <div>
          <b style="font-size:1.1rem">${esc(m.titulo)}</b>
          <span class="tag ${completada?'aprobada':''}" style="margin-left:6px">+${m.puntos} pts</span>
        </div>
        <span class="mute" style="font-size:.82rem">⏳ ${esc(tiempoRestante(m.fecha_limite))}</span>
      </div>
      ${m.descripcion ? `<p style="margin:6px 0">${esc(m.descripcion)}</p>` : ''}
      <div class="ev-box">
        <b>📸 Requisito obligatorio:</b> Debes enviar una <b>foto o evidencia al jefe</b> del cumplimiento de esta misión para que te la validen.
      </div>
      <div class="row" style="margin-top:8px">
        ${completada
          ? `<span class="ok">✔ ¡Misión completada y validada!</span>
             <button class="gold" onclick="copiarImagenLogro('${esc(m.titulo).replace(/'/g,"\\'")}', ${m.puntos})">📋 Copiar imagen de logro para compartir</button>`
          : exp
            ? `<span class="mute">Esta misión ya expiró.</span>`
            : `<span class="mute">Envía tu evidencia al jefe para desbloquear tu insignia.</span>`
        }
      </div>
    </div>`;
  }).join('');
}

async function copiarImagenLogro(tituloMision, puntos){
  try{
    const canvas = document.createElement('canvas');
    canvas.width = 900; canvas.height = 480;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 900, 480);
    grad.addColorStop(0, '#0f2a43');
    grad.addColorStop(1, '#0e8f83');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 900, 480);

    ctx.strokeStyle = '#e0a526';
    ctx.lineWidth = 10;
    ctx.strokeRect(24, 24, 852, 432);

    ctx.fillStyle = '#e0a526';
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillText('🏆 MISIÓN CUMPLIDA · OPERACIÓN', 60, 88);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 46px system-ui, sans-serif';
    ctx.fillText(D.nombre, 60, 165);

    ctx.fillStyle = '#b9c7d6';
    ctx.font = '26px system-ui, sans-serif';
    ctx.fillText('Completó exitosamente el reto:', 60, 225);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(`"${tituloMision}"`, 60, 278);

    ctx.fillStyle = '#e0a526';
    ctx.beginPath();
    ctx.roundRect(60, 325, 250, 64, 32);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 32px system-ui, sans-serif';
    ctx.fillText(`+${puntos} PUNTOS`, 88, 368);

    ctx.fillStyle = '#e3f6f3';
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText(`Equipo: ${getEquipo(D.nombre, S.ced).toUpperCase()} · ${new Date().toLocaleDateString('es')}`, 340, 366);

    canvas.toBlob(async blob => {
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        notify('📋 ¡Imagen copiada!', 'Pégala (Ctrl+V) en tu chat o grupo para compartir tu logro.', 'success');
      }catch(err){
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `logro-${norm(tituloMision)}.png`;
        a.click();
        notify('📥 Imagen descargada', 'Tu navegador bloqueó el copiado directo; se descargó la imagen.', 'info');
      }
    }, 'image/png');
  }catch(e){
    alert('No se pudo generar la imagen de logro.');
  }
}

function compet(rk,i,pts){
  const d=(H&&H.dias)||[],tot=d.reduce((a,x)=>a+x.indicadores.length,0),ok=d.reduce((a,x)=>a+x.indicadores.filter(y=>y.cumplido).length,0);
  const perf=x=>x.indicadores.length&&x.indicadores.every(y=>y.cumplido);
  let racha=0;for(const x of d){if(perf(x))racha++;else break}
  const mejor=d.reduce((a,x)=>Math.max(a,x.puntos),0);
  let g='';
  if(i>=0&&rk.length>1){
    if(i===0){const dif=pts-rk[1].puntos;g=`<span class="ic">🏆</span><span><b>¡Vas de primero en esta tabla!</b><br><span class="mute">${dif>0?`Tienes ${dif} pts de ventaja. Cada día cumplido la cuida.`:'Estás empatado en la cima. Un día más cumplido te separa.'}</span></span>`}
    else{const dif=rk[i-1].puntos-pts;g=`<span class="ic">🎯</span><span><b>${dif>0?`A ${dif} pts de subir al puesto ${i}`:`Empatado con el puesto ${i}`}</b><br><span class="mute">${rk[i+1]?`Tu ventaja sobre el puesto ${i+2}: ${pts-rk[i+1].puntos} pts.`:'Cumplir tus indicadores de hoy te acerca.'}</span></span>`}
  }
  return (g?`<div class="card gap">${g}</div>`:'')+`<div class="stats"><div><b>${d.filter(perf).length}</b><span>Días perfectos</span></div><div><b>${racha}</b><span>Racha de días perfectos</span></div><div><b>${tot?Math.round(ok/tot*100):0}%</b><span>Indicadores cumplidos</span></div><div><b>${mejor}</b><span>Mejor día (pts)</span></div></div>`;
}
function podio(rk){
  if(rk.length<3)return '';
  const t=[rk[1],rk[0],rk[2]],pos=[2,1,3];
  return `<div class="podio">${t.map((x,k)=>`<div class="c p${pos[k]} ${x.yo?'yo':''}"><div class="nm">${esc(x.nombre.split(' ').slice(0,2).join(' '))}${x.yo?' (tú)':''}</div><div class="bl">${['🥈','🥇','🥉'][k]}<small>${x.puntos} pts</small></div></div>`).join('')}</div>`;
}
function dias(){
  const d=(H&&H.dias)||[];
  if(!d.length) return '<p class="mute">Aún no hay resultados diarios cargados este mes.</p>';
  return d.map(x=>{const f=new Date(x.fecha+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}),n=x.indicadores.length,c=x.indicadores.filter(i=>i.cumplido).length,pf=n>0&&c===n,
  eq=x.eq_total?Math.round(x.eq_ok/x.eq_total*100):null,yo=n?Math.round(c/n*100):0,st=x.estrellas||[];
  return `<div class="card dia ${pf?'perf':''}"><div class="cab"><span><b>${esc(f)}</b><br><span class="big">${c}<small> de ${n} indicadores</small></span></span><span class="tot">+${x.puntos} pts${pf?'<br><span class="tag aprobada">Día perfecto</span>':''}</span></div>`
  +`<div class="seg" aria-hidden="true">${x.indicadores.map(i=>`<i class="${i.cumplido?'s':''}"></i>`).join('')}</div>`
  +(eq!=null?`<div class="cmp">Tú: ${yo}% · Equipo: ${eq}% ${yo>eq?'— por encima del equipo 👏':yo===eq?'— al ritmo del equipo':'— el equipo te saca ventaja, ¡mañana se recupera!'}</div>`:'')
  +x.indicadores.map(i=>`<div class="it"><span>${esc(i.nombre)}</span><span class="${i.cumplido?'si':'no'}">${i.cumplido?'✔ Cumplió · +'+i.puntos+' pts':'✘ No cumplió · 0 pts'}</span></div>`).join('')
  +(st.length?`<div class="star">⭐ Día perfecto de: ${st.map(n=>n===D.nombre?'<b>tú</b>':esc(n)).join(', ')}</div>`:'')+'</div>'}).join('');
}
async function postular(){

const PAL=['#0e8f83','#4a7fd1','#8a63c9','#d6543f','#2aa6c9','#7aa63a'],GOLD='#e0a526',PRI=['csat','leads','nps','acuracidad ea','acuracidad pqc'];
const corto=n=>n.split(' ').slice(0,2).join(' ');
function posView(){
  if(!G||!G.personas||!G.personas.length)return '<p class="mute">No se pudo cargar el detalle de posiciones.</p>';
  const P_ALL=G.personas;
  const P = adminFiltroEq==='global' ? P_ALL : P_ALL.filter(p => getEquipo(p.nombre, p.cedula) === adminFiltroEq);
  if(!P.length) return '<p class="mute">No hay integrantes en este equipo.</p>';

  const ind=G.indicadores,nf=G.fechas.length,mx=Math.max(1,...P.map(p=>p.puntos));
  const ord=ind.map((x,k)=>k).sort((a,b)=>{const pa=PRI.indexOf(ind[a].nombre.toLowerCase()),pb=PRI.indexOf(ind[b].nombre.toLowerCase());return (pa<0?99:pa)-(pb<0?99:pb)||a-b});
  const col=k=>PAL[ord.indexOf(k)%PAL.length],ip=(p,k)=>p.por_indicador[k].dias_ok*p.por_indicador[k].puntos;
  if(!selP||!P.find(p=>p.cedula===selP))selP=P[0].cedula;
  const perfect=ind.reduce((a,x)=>a+x.puntos,0);

  const filtroBar = `<div class="row" style="margin-bottom:12px">
    <h2 style="margin:0">¿Por qué cada persona está en su puesto?</h2>
    <div class="seg-switch" style="margin:0">
      <button class="${adminFiltroEq==='global'?'on':''}" onclick="adminFiltroEq='global';drawAdmin()">Global</button>

      <button class="${adminFiltroEq==='social'?'on':''}" onclick="adminFiltroEq='social';drawAdmin()">Social</button>
    </div>
  </div>`;

  const ex=`<div class="exp"><div><b>1 · Puntos por indicador</b><span class="mute">Cada día que cumple un indicador suma sus puntos: ${ord.map(k=>esc(ind[k].nombre)+' '+ind[k].puntos).join(' · ')}. Un día perfecto vale ${perfect} pts.</span></div><div><b>2 · Atenciones increíbles</b><span class="mute">Cada postulación aprobada suma 7 pts directos al ranking del mes.</span></div><div><b>3 · Orden del ranking</b><span class="mute">De mayor a menor puntaje del mes (${esc(G.mes)}). En empate se ordena por nombre. Días con datos: ${nf}.</span></div></div>`;
  const leg=`<div class="leg">${ord.map(k=>`<span><i style="background:${col(k)}"></i>${esc(ind[k].nombre)}</span>`).join('')}<span><i style="background:${GOLD}"></i>Atenciones increíbles</span></div>`;
  const bars=P.map((p,j)=>`<div class="sb"><span class="sn">${j+1}. ${esc(corto(p.nombre))}</span><div class="st" role="img" aria-label="${esc(p.nombre)}: ${p.puntos} puntos">${ord.map(k=>{const v=ip(p,k);return v?`<i style="width:${v/mx*100}%;background:${col(k)}" title="${esc(ind[k].nombre)}: ${v} pts"></i>`:''}).join('')}${p.pts_post?`<i style="width:${p.pts_post/mx*100}%;background:${GOLD}" title="Atenciones increíbles: ${p.pts_post} pts"></i>`:''}</div><b>${p.puntos}</b></div>`).join('');
  const motivo=j=>{const p=P[j];
    const fz=ord.filter(k=>p.por_indicador[k].dias_total>0).map(k=>({n:ind[k].nombre,r:p.por_indicador[k].dias_ok/p.por_indicador[k].dias_total,o:p.por_indicador[k].dias_ok,t:p.por_indicador[k].dias_total}));
    let a='';if(fz.length){const mj=fz.reduce((x,y)=>y.r>x.r?y:x),pe=fz.reduce((x,y)=>y.r<x.r?y:x);a=` Más fuerte: ${esc(mj.n)} (${mj.o}/${mj.t} días). ${pe.r<1&&pe!==mj?`A reforzar: ${esc(pe.n)} (${pe.o}/${pe.t}).`:''}`}
    if(j===0)return `Lidera${P[1]?` con ${p.puntos-P[1].puntos} pts sobre ${esc(corto(P[1].nombre))}`:''}.${a}`;
    const u=P[j-1],dif=u.puntos-p.puntos;
    if(!dif)return `Empatado en ${p.puntos} pts con ${esc(corto(u.nombre))}; el desempate es por nombre.${a}`;
    const cs=[...ord.map(k=>({n:ind[k].nombre,d:ip(u,k)-ip(p,k)})),{n:'Atenciones increíbles',d:u.pts_post-p.pts_post}].filter(x=>x.d>0).sort((x,y)=>y.d-x.d).slice(0,2);
    return `A ${dif} pts del puesto ${j}.${cs.length?' Donde más se separa: '+cs.map(x=>`${esc(x.n)} (−${x.d} pts)`).join(' y ')+'.':''}${a}`;};
  const tabla=`<div style="overflow-x:auto"><table class="pz"><tr><th>#</th><th>Persona</th><th>Pts</th>${ord.map(k=>`<th>${esc(ind[k].nombre)}<br><span style="font-weight:400">días cumplidos</span></th>`).join('')}<th>Atenc. aprobadas</th></tr>`
   +P.map((p,j)=>`<tr><td class="n">${j+1}</td><td><b>${esc(p.nombre)}</b> ${equipoLabel(getEquipo(p.nombre, p.cedula))}</td><td class="n">${p.puntos}</td>${ord.map(k=>{const x=p.por_indicador[k];return `<td>${x.dias_ok}/${x.dias_total}<br><span class="mute">${ip(p,k)} pts</span></td>`}).join('')}<td>${p.aprobadas}${p.pendientes?` <span class="mute">(+${p.pendientes} en revisión)</span>`:''}<br><span class="mute">${p.pts_post} pts</span></td></tr><tr class="mv"><td></td><td colspan="${3+ord.length}">${motivo(j)}</td></tr>`).join('')+'</table></div>';
  const heat=nf?`<div style="overflow-x:auto"><table class="hm"><tr><th></th>${G.fechas.map(f=>`<th>${f.slice(8)}/${f.slice(5,7)}</th>`).join('')}</tr>`
   +P.map((p,j)=>{const m={};p.dias.forEach(d=>m[d.fecha]=d);return `<tr><td class="nm">${j+1}. ${esc(corto(p.nombre))}</td>${G.fechas.map(f=>{const d=m[f];return d?`<td style="background:rgba(14,143,131,${(0.12+0.88*d.ok/d.total).toFixed(2)});${d.ok===d.total?'outline:2px solid '+GOLD+';':''}" title="${esc(p.nombre)} · ${f}: ${d.ok} de ${d.total} · ${d.pts} pts">${d.ok}</td>`:'<td style="background:var(--line)" title="Sin registros">·</td>'}).join('')}</tr>`}).join('')+'</table></div><p class="mute" style="margin:8px 0 0">Número = indicadores cumplidos ese día. Más oscuro = más cumplimiento. Borde dorado = día perfecto. Gris = sin registros.</p>':'<p class="mute">Aún no hay días cargados este mes.</p>';
  const p=P.find(x=>x.cedula===selP),pos=P.indexOf(p)+1,dm={};p.dias.forEach(d=>dm[d.fecha]=d);
  const W=620,Hh=170,bw=Math.max(4,Math.min(26,(W-40)/Math.max(1,nf)-3)),stp=(W-40)/Math.max(1,nf);let acc=0;const tot=Math.max(1,p.puntos-p.pts_post);
  const sv=G.fechas.map((f,i)=>{const d=dm[f],x=30+i*stp,h=d?d.pts/Math.max(1,perfect)*(Hh-40):0;return `<rect x="${x}" y="${Hh-20-h}" width="${bw}" height="${Math.max(h,d?2:0)}" rx="2" fill="${d&&d.ok===d.total?GOLD:'#0e8f83'}"><title>${f}: ${d?d.pts+' pts · '+d.ok+' de '+d.total:'sin registros'}</title></rect><text x="${x+bw/2}" y="${Hh-6}" font-size="8" text-anchor="middle" fill="currentColor" opacity=".6">${f.slice(8)}</text>`}).join('');
  const pts=G.fechas.map((f,i)=>{acc+=dm[f]?dm[f].pts:0;return `${(30+i*stp+bw/2).toFixed(1)},${(Hh-20-acc/tot*(Hh-40)).toFixed(1)}`}).join(' ');
  const dd=p.dias,perf=dd.filter(d=>d.ok===d.total).length,mejor=dd.reduce((a,d)=>Math.max(a,d.pts),0),okT=dd.reduce((a,d)=>a+d.ok,0),tT=dd.reduce((a,d)=>a+d.total,0);
  const det=`<div class="row row2" style="max-width:420px"><label>Persona<select onchange="selP=this.value;drawAdmin()">${P.map((x,j)=>`<option value="${x.cedula}" ${x.cedula===selP?'selected':''}>${j+1}. ${esc(x.nombre)}</option>`).join('')}</select></label></div>
   <div class="dt"><div><b>${pos} de ${P.length}</b>Puesto actual</div><div><b>${p.puntos}</b>Puntos del mes</div><div><b>${tT?Math.round(okT/tT*100):0}%</b>Indicadores cumplidos</div><div><b>${perf}</b>Días perfectos · mejor día ${mejor} pts</div></div>
   <p class="mute" style="margin:0 0 4px"><b style="color:var(--ink)">Cómo llegó a ${p.puntos} puntos</b></p>
   ${ord.map(k=>{const x=p.por_indicador[k],r=x.dias_total?x.dias_ok/x.dias_total*100:0;return `<div class="cmpb"><span>${esc(x.nombre)}</span><span class="tr"><i style="width:${r}%;background:${col(k)}"></i></span><span>${x.dias_ok} de ${x.dias_total} días × ${x.puntos} = <b>${ip(p,k)}</b></span></div>`}).join('')}
   <div class="cmpb"><span>Atenciones increíbles</span><span class="tr"><i style="width:${p.aprobadas?100:0}%;background:${GOLD}"></i></span><span>${p.aprobadas} aprobadas × 7 = <b>${p.pts_post}</b>${p.pendientes?` · ${p.pendientes} en revisión`:''}${p.con_feedback?` · ${p.con_feedback} con feedback`:''}</span></div>
   <p class="mute" style="margin:14px 0 4px"><b style="color:var(--ink)">Puntos por día</b> (barra dorada = día perfecto; línea = acumulado)</p>
   <svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto;color:var(--ink)" role="img" aria-label="Puntos por día y acumulado"><line x1="26" y1="${Hh-20}" x2="${W-6}" y2="${Hh-20}" stroke="var(--line)"/>${sv}${nf?`<polyline points="${pts}" fill="none" stroke="${'#d6543f'}" stroke-width="2"/>`:''}</svg>`;
  return `${filtroBar}${ex}
  <div class="card"><b>Cómo se compone el puntaje de cada persona</b>${leg}${bars}</div>
  <div class="card"><b>Detalle y motivo por puesto</b><p class="mute" style="margin:2px 0 8px">Días cumplidos de los días con registro, y qué tanto se separa cada persona de quien tiene arriba.</p>${tabla}</div>
  <div class="card"><b>Mapa de cumplimiento por día</b><p class="mute" style="margin:2px 0 8px">Quién cumplió cuántos indicadores cada día del mes.</p>${heat}</div>
  <div class="card"><b>Análisis individual</b>${det}</div>`;
}
let popOpen=false;
const dd=n=>n+(n===1?' día':' días');
const perfectDay=()=>D.indicadores.reduce((a,x)=>a+x.puntos,0);
function ritmo(){const d=(H&&H.dias)||[];return d.length?d.reduce((a,x)=>a+x.puntos,0)/d.length:0}
function mision(){
  const pd=perfectDay(),n=D.indicadores.length;
  return `<div class="card mis"><h3>🎯 Tu misión de hoy</h3><p>Hoy puedes sumar hasta <b>${pd+7} pts</b>: <b>${pd}</b> cumpliendo tus ${n} indicadores y <b>7 más</b> si una atención tuya es aprobada como increíble.</p>
  <div class="chips">${D.indicadores.map(i=>`<span class="chip">${esc(i.nombre)} +${i.puntos}</span>`).join('')}<span class="chip g">Atención increíble +7</span></div>
  <div class="btns"><button onclick="popPost()">✨ Postular una atención</button><button class="sec" onclick="popOpenF()">💡 ¿Cómo funciona?</button></div></div>`;
}
function incCards(pts){
  const inc=D.incentivos.slice().sort((a,b)=>a.meta-b.meta),pd=perfectDay(),r=ritmo(),nx=inc.find(n=>pts<n.meta);
  if(!inc.length)return '<p class="mute">Aún no hay incentivos definidos para este mes.</p>';
  return inc.map(n=>{
    const pct=Math.min(100,Math.round(pts/n.meta*100)),falta=n.meta-pts,ok=falta<=0,cerca=!ok&&pct>=80,prox=n===nx&&!cerca;
    const rb=ok?'¡LOGRADO! 🎉':cerca?'¡CASI LO TIENES! 🔥':prox?'TU PRÓXIMO PREMIO':'';
    let how='';
    if(!ok&&pd){
      const dp=Math.ceil(falta/pd),dp2=Math.ceil(Math.max(0,falta-7)/pd),pl=k=>k===1?'':'s';
      how=`<div class="how"><b>🧭 ¿Cómo lo logro?</b><ul>`
      +(falta<=7?`<li>¡Una sola <b>atención increíble aprobada</b> (+7 pts) te lleva a la meta!</li>`:`<li><b>${dp} día${pl(dp)} perfecto${pl(dp)}</b>, cumpliendo todos los indicadores (${pd} pts por día).</li><li>O <b>1 atención increíble aprobada</b> (+7) más <b>${dp2} día${pl(dp2)} perfecto${pl(dp2)}</b>.</li>`)
      +(r>0?`<li>A tu ritmo actual (${r.toFixed(1)} pts por día) llegarías en unos <b>${dd(Math.ceil(falta/r))} con registro</b>.</li>`:'')+`</ul></div>`;
    }
    return `<div class="card inc ${ok?'lg':cerca?'cerca':prox?'prox':''}">${rb?`<span class="rb">${rb}</span>`:''}
    <div class="pr"><span class="gift">${ok?'🏆':'🎁'}</span><div><b>${esc(n.premio)}</b><span>${esc(n.nombre)} · meta ${n.meta} pts</span></div></div>
    <div class="nums"><div>${ok?'<span class="big">¡Meta cumplida!</span>':`<span class="big">${falta}</span> <span class="mute">pts para ganarlo</span>`}</div><b>${pct}%</b></div>
    <div class="track ${ok?'ok':''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <span class="mute">Llevas ${pts} de ${n.meta} puntos${ok?'. ¡Felicitaciones!':''}</span>${how}</div>`;
  }).join('');
}
function misInd(){
  const d=(H&&H.dias)||[],st={};
  d.forEach(x=>x.indicadores.forEach(i=>{const q=st[i.nombre]=st[i.nombre]||{ok:0,t:0};q.t++;if(i.cumplido)q.ok++}));
  const rows=D.indicadores.map(i=>{const q=st[i.nombre]||{ok:0,t:0};return{...i,ok:q.ok,t:q.t,perd:(q.t-q.ok)*i.puntos}});
  const opp=rows.filter(x=>x.perd>0).sort((a,b)=>b.perd-a.perd)[0];
  return rows.map(x=>{const p=x.t?Math.round(x.ok/x.t*100):0;return `<div class="card ib"><div class="tp"><span><b>${esc(x.nombre)}</b> <span class="mute">· ${x.puntos} pts por día cumplido</span></span><b>${x.dias*x.puntos} pts</b></div><div class="tr" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%;background:${p>=80?'var(--teal)':p>=50?'var(--gold)':'var(--coral)'}"></i></div><span class="mute">${x.t?`Lo cumpliste ${x.ok} de ${dd(x.t)} (${p}%)`:'Aún sin registros este mes'}</span></div>`}).join('')
  +(opp?`<div class="card opp"><b>💎 Tu mayor oportunidad: ${esc(opp.nombre)}</b><br><span>Este mes dejaste de sumar <b>${opp.perd} pts</b> aquí (${dd(opp.t-opp.ok)} sin cumplir × ${opp.puntos} pts). Cumplirlo cada día es el camino más rápido para subir.</span></div>`:'');
}

function popHide(){const e=document.getElementById('pop');if(e)e.remove();const o=document.getElementById('ov'),d=document.getElementById('dw');if(o)o.remove();if(d)d.remove();popOpen=false}
function popShow(){
  popHide();if(!D||S.a)return;
  const perfect=D.indicadores.reduce((a,x)=>a+x.puntos,0),aprob=D.postulaciones.filter(p=>p.estado==='aprobada').length,teaser=!sessionStorage.getItem('pz');
  const w=document.createElement('div');w.id='pop';
  w.innerHTML=`${teaser?`<div class="tz" id="tz"><button class="x" aria-label="Cerrar aviso" onclick="popTz()">×</button><b>🏅 ¡Suma 7 pts extra!</b><br>Registra una atención increíble y, si la aprueban, sube en el ranking.<br><button onclick="popOpenF()">Ver cómo</button></div>`:''}<button class="tab" onclick="popOpenF()" aria-label="Abrir: cómo sumo puntos">💡 ¿Cómo sumo puntos?</button>`;
  const o=document.createElement('div');o.id='ov';o.className='ov';o.onclick=popClose;
  const d=document.createElement('aside');d.id='dw';d.className='dw';d.setAttribute('role','dialog');d.setAttribute('aria-label','Cómo sumar puntos');
  d.innerHTML=`<button class="cl" aria-label="Cerrar" onclick="popClose()">×</button><h2>¡Tú decides cuánto sumas! 🚀</h2><p class="mute" style="margin:0">Cada día es una nueva oportunidad de subir en el ranking.</p>
  <div class="stp"><span class="no2">1</span><div><b>Cumple tus indicadores</b><ul>${D.indicadores.map(i=>`<li>${esc(i.nombre)}: <b>+${i.puntos} pts</b> por día cumplido</li>`).join('')}</ul></div></div>
  <div class="stp"><span class="no2">2</span><div><b>Registra tus interacciones destacadas</b><br><span class="mute">Cuando tengas una atención de la que te sientas orgulloso, postúlala con el número de caso y cuenta qué pasó y por qué fue excepcional.</span></div></div>
  <div class="stp g"><span class="no2">3</span><div><b>Si la aprueban como gran gestión: +7 pts 🏅</b><br><span class="mute">Una atención increíble aprobada suma 7 puntos directos a tu ranking del mes. Si no se aprueba, recibes feedback y un compromiso de mejora: aprendes y puedes volver a postular.</span></div></div>
  <div class="ex"><b>Un ejemplo:</b> un día perfecto suma ${perfect} pts. Si además una atención tuya es aprobada, ese día pesa <b>${perfect+7} pts</b> en tu ranking.${aprob?`<br>Ya tienes <b>${aprob}</b> ${aprob>1?'atenciones aprobadas':'atención aprobada'}, ¡sigue así!`:''}</div>
  <p style="margin:16px 0 0"><button onclick="popPost()">✨ Postular una atención ahora</button></p>`;
  document.body.append(w,o,d);
}
function popTz(){sessionStorage.setItem('pz','1');const t=document.getElementById('tz');if(t)t.remove()}
function popOpenF(){popTz();popOpen=true;document.getElementById('ov').classList.add('on');const d=document.getElementById('dw');d.classList.add('on');d.querySelector('.cl').focus()}
function popClose(){popOpen=false;const o=document.getElementById('ov'),d=document.getElementById('dw');if(o)o.classList.remove('on');if(d)d.classList.remove('on')}
function popPost(){popClose();userTab='resultados';drawUser();const h=document.getElementById('postular');if(h)h.scrollIntoView({behavior:'smooth'});setTimeout(()=>{const n=document.getElementById('nc');if(n)n.focus()},500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&popOpen)popClose()});

async function g(fn,args){try{await rpc(fn,{p_admin:S.clave,...args});await load()}catch(e){alert(e.message)}}
const del=(t,id)=>confirm('¿Borrar? No se puede deshacer.')&&g('admin_borrar',{p_tabla:t,p_id:String(id)});
const evaluar=(id,ok)=>g('admin_evaluar',{p_id:id,p_ok:ok,p_puntos:7,p_feedback:$('#f'+id).value,p_compromiso:$('#c'+id).value});
async function lote(){
  const dup=F&&F.fechas.find(x=>x.fecha===$('#fe').value);
  if(dup&&!confirm(fdl(dup.fecha)+' ya tiene '+dup.registros+' registros cargados. ¿Quieres reemplazarlos con estos?'))return;
  const datos=$('#lt').value.split('\n').map(l=>l.split(',').map(s=>s.trim())).filter(a=>a.length>=3)
    .map(a=>({cedula:a[0],indicador:a[1],cumplido:a[2]==='1'}));
  try{const n=await rpc('admin_lote',{p_admin:S.clave,p_fecha:$('#fe').value,p_datos:datos});await load();tab='dia';drawAdmin();$('#lm').textContent=n+' registros guardados'}catch(e){alert(e.message)}
}
S?load():login();
</script>
