<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking de indicadores</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0f2a43;--mute:#5b6f82;--line:#d5dee8;--teal:#0e8f83;--gold:#e0a526;--coral:#d6543f}
@media(prefers-color-scheme:dark){:root{--bg:#0c1a29;--card:#12263a;--ink:#e8eef5;--mute:#93a7ba;--line:#24405a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif;padding:16px}
main{max-width:760px;margin:0 auto}
main.wide{max-width:1120px}
h1,h2,h3{margin:0;line-height:1.15}
h2{font-size:1.15rem;margin:28px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.hero{background:var(--ink);color:#fff;border-radius:10px;padding:22px;margin-bottom:6px}
.hero b{font-size:3.4rem;font-weight:800;display:block;line-height:1}
.hero span{color:#b9c7d6}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 8px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;background:var(--teal);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--mute);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.track i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .6s}
.track.ok i{background:var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.rk{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:8px}
.rk.yo{background:var(--teal);color:#fff;font-weight:600}
.rk .n{font-weight:800;font-size:1.1rem}
.mute{color:var(--mute);font-size:.9rem}
.tag{font-size:.8rem;padding:2px 8px;border-radius:20px;background:var(--line)}
.tag.aprobada{background:var(--gold);color:#222}.tag.feedback{background:var(--coral);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:#fff}
.dia{padding:0;overflow:hidden}
.dia .cab{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dia .cab b{text-transform:capitalize}
.dia .tot{font-weight:800;color:var(--teal);white-space:nowrap}
.dia .it{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line)}
.dia .it:last-child{border-bottom:0}
.dia .si{color:var(--teal);font-weight:600}.dia .no{color:var(--coral);font-weight:600}
.gap{display:flex;gap:12px;align-items:center}
.gap .ic{font-size:1.8rem;line-height:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center}
.stats b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1}
.stats span{font-size:.8rem;color:var(--mute)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.podio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-bottom:10px;min-height:190px}
.podio .c{text-align:center}
.podio .nm{font-size:.9rem;font-weight:600;margin-bottom:4px;overflow-wrap:anywhere}
.podio .bl{border-radius:10px 10px 0 0;background:var(--line);color:var(--ink);padding:10px 4px;font-weight:800;font-size:1.5rem}
.podio .bl small{display:block;font-size:.8rem;font-weight:600;color:var(--mute)}
.podio .p1 .bl{background:var(--gold);color:#222;height:120px}.podio .p1 .bl small{color:#4a3a10}
.podio .p2 .bl{height:90px}.podio .p3 .bl{height:68px}
.podio .yo .bl{background:var(--teal);color:#fff}.podio .yo .bl small{color:#d6f2ee}
.rk .bar{grid-column:2/4;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--teal)}
.rk.yo .bar{background:rgba(255,255,255,.3)}.rk.yo .bar i{background:#fff}
.dia .big{font-size:1.9rem;font-weight:800;line-height:1}
.dia .big small{font-size:1rem;color:var(--mute);font-weight:600}
.dia .seg{display:flex;gap:4px;padding:10px 16px 4px}
.dia .seg i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.dia .seg i.s{background:var(--teal)}
.dia .cmp{padding:4px 16px 10px;font-size:.9rem;color:var(--mute)}
.dia .star{padding:10px 16px;background:rgba(224,165,38,.16);font-size:.9rem}
.dia.perf{border-color:var(--gold)}
.lay{display:grid;grid-template-columns:minmax(290px,350px) 1fr;gap:22px;align-items:start}
.lay aside{position:sticky;top:16px}
.lay h2:first-child{margin-top:0}
@media(max-width:860px){.lay{grid-template-columns:1fr}.lay aside{position:static}}
.rl{display:grid;grid-template-columns:28px 36px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px}
.rl+.rl{margin-top:2px}
.rl.yo{background:var(--teal);color:#fff}
.rl .pos{font-weight:800;text-align:center;font-size:1.05rem}
.av{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.rl.yo .av{background:rgba(255,255,255,.25)}
.rl .nm2{font-weight:600;font-size:.95rem;line-height:1.2;overflow-wrap:anywhere}
.rl .pt{font-weight:800;white-space:nowrap}
.rl .bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px}
.rl .bar i{display:block;height:100%;background:var(--teal)}
.rl.yo .bar{background:rgba(255,255,255,.3)}.rl.yo .bar i{background:#fff}
.hero.fr{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;background:linear-gradient(135deg,var(--teal),#0a6a62)}
.hero.fr b{display:inline;font-size:2.6rem}
.hero.fr span{color:#e3f6f3}
.hero.fr .em{font-size:3rem}
.upd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.upd b{font-weight:600}
.upd button{padding:4px 12px;font-size:.85rem;margin-left:auto}
.fch{width:100%;border-collapse:collapse;font-size:.92rem}
.fch th,.fch td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.fch th{color:var(--mute);font-weight:600;font-size:.82rem}
.fch button{padding:4px 10px;font-size:.82rem}
.est{font-size:.8rem;padding:2px 8px;border-radius:20px;white-space:nowrap}
.est.c{background:var(--teal);color:#fff}.est.i{background:var(--gold);color:#222}
.err{color:var(--coral);font-weight:600;min-height:1.4em}
.ok{color:var(--teal);font-weight:600}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ====== CONFIGURA ESTO (Supabase > Project Settings > API) ======
const URL_='https://ucpifysuxxgyiyahfkgg.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjcGlmeXN1eHhneWl5YWhma2dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MTA0NTQsImV4cCI6MjExMTE4NjQ1NH0.uYTSzRJ_hKwiovyTK-r6meRBnNCQeoKlIWADkM6ED6E';
// ================================================================
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=JSON.parse(sessionStorage.getItem('s')||'null'), D=null, H=null, F=null, tab='post', msg='';

async function rpc(fn,body){
  const r=await fetch(`${URL_}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const tx=await r.text(); let j=null; try{j=tx?JSON.parse(tx):null}catch(e){j={message:tx}}
  if(!r.ok) throw new Error((j&&j.message)||'Error de conexión'); return j;
}
async function load(){
  try{
    D=S.a?await rpc('admin_panel',{p_admin:S.clave}):await rpc('mi_panel',{p_ced:S.ced,p_clave:S.clave});
    if(S.a){try{F=await rpc('admin_fechas',{p_admin:S.clave})}catch(e){F=null}}
    if(!S.a){try{H=await rpc('mi_historial',{p_ced:S.ced,p_clave:S.clave})}catch(e){H=null}}
    sessionStorage.setItem('s',JSON.stringify(S)); draw();
  }catch(e){S=null;sessionStorage.removeItem('s');login(e.message)}
}
function login(err=''){
  app.className='';app.innerHTML=`<div class="card" style="margin-top:8vh"><h1>Ranking de indicadores</h1>
  <p class="mute">Ingresa con tu cédula y tu clave.</p>
  <label>Cédula<input id="c" inputmode="numeric" autocomplete="username"></label>
  <label>Clave<input id="k" type="password" autocomplete="current-password"></label>
  <p class="err">${esc(err)}</p><button id="go">Entrar</button>
  <button class="sec" id="adm" style="margin-left:6px">Soy administrador</button></div>`;
  $('#go').onclick=()=>{S={ced:$('#c').value.trim(),clave:$('#k').value};load()};
  $('#adm').onclick=()=>{S={a:1,clave:$('#k').value};load()};
}
function out(){S=null;sessionStorage.removeItem('s');login()}
function draw(){app.className=S.a?'':'wide';S.a?drawAdmin():drawUser()}

// ---------- Vista de la persona ----------
function ini(n){return n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function rankList(rk){
  const mx=rk[0]?rk[0].puntos:0,med=['🥇','🥈','🥉'];
  return `<div class="card" style="padding:8px">${rk.map((x,j)=>`<div class="rl ${x.yo?'yo':''}"><span class="pos">${med[j]||j+1}</span><span class="av">${esc(ini(x.nombre))}</span><span><div class="nm2">${esc(x.nombre.split(' ').slice(0,2).join(' '))}${x.yo?' (tú)':''}</div><div class="bar"><i style="width:${mx?Math.round(x.puntos/mx*100):0}%"></i></div></span><span class="pt">${x.puntos} pts</span></div>`).join('')}</div>`;
}
function updTxt(){
  if(!H)return '';
  const f=H.actualizado?new Date(H.actualizado).toLocaleString('es',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit'}):'',
  h=H.hasta?new Date(H.hasta+'T12:00:00').toLocaleDateString('es',{day:'numeric',month:'long'}):'';
  if(!f&&!h)return '<div class="upd"><span>🕒 Aún no hay información cargada.</span></div>';
  return `<div class="upd"><span>🕒 ${f?`Última actualización: <b>${esc(f)}</b>`:''}${f&&h?' · ':''}${h?`Resultados hasta el <b>${esc(h)}</b>`:''}</span><button class="sec" onclick="load()">Recargar</button></div>`;
}
function drawUser(){
  const rk=D.ranking, i=rk.findIndex(x=>x.yo), me=rk[i], pts=me?me.puntos:0, em=i===0?'🏆':i===1?'🥈':i===2?'🥉':'💪';
  app.innerHTML=`<div class="top"><div><h1>¡Hola, ${esc(D.nombre.split(' ')[0])}! 👋</h1><span class="mute">Así vas en ${esc(D.mes)}</span></div><button class="sec" onclick="out()">Salir</button></div>
  ${updTxt()}
  <div class="hero fr"><div><span>Tu puesto este mes</span><br><b>${i+1}</b><span style="font-size:1.4rem"> de ${rk.length}</span><br><span>${pts} puntos sumados</span></div><span class="em">${em}</span></div>
  <div class="lay">
  <aside><h2>🏆 Ranking del equipo</h2>
    <p class="mute" style="margin:0 0 10px">Se ordena por los puntos que sumas cada día que cumples tus indicadores. ¡Todos pueden subir de puesto!</p>
    ${podio(rk)}${rankList(rk)}</aside>
  <section>
  ${compet(rk,i,pts)}
  <h2>🎁 Incentivos del mes</h2>
  ${D.incentivos.map(n=>{const f=Math.min(100,pts/n.meta*100),ok=pts>=n.meta;return `<div class="card"><div class="row"><b>${esc(n.nombre)}</b><span>${esc(n.premio)}</span></div>
  <div class="track ${ok?'ok':''}"><i style="width:${f}%"></i></div>
  <span class="mute">${ok?'¡Lo lograste! 🎉':`Llevas ${pts} de ${n.meta} puntos. Te faltan ${n.meta-pts}.`}</span></div>`}).join('')||'<p class="mute">Aún no hay incentivos definidos para este mes.</p>'}
  <h2>📊 Mis indicadores</h2>${D.indicadores.map(n=>`<div class="card row"><span>${esc(n.nombre)}<br><span class="mute">${n.puntos} puntos por día cumplido</span></span><b>${n.dias} días · ${n.dias*n.puntos} pts</b></div>`).join('')}
  <h2>📅 Mis días</h2>${dias()}
  <h2>✨ Postular una atención increíble</h2>
  <div class="card"><p class="mute">Indica el número de caso y cuéntanos qué pasó y por qué fue excepcional. Será evaluada: si realmente es una atención increíble, ganas 7 puntos; si no, recibes feedback con un compromiso.</p>
  <input id="nc" maxlength="60" placeholder="Número de caso">
  <textarea id="t" rows="4" maxlength="2000" placeholder="Describe la conversación o atención"></textarea>
  <button onclick="postular()">Enviar postulación</button> <span class="ok">${esc(msg)}</span></div>
  ${D.postulaciones.map(p=>`<div class="card"><div class="row"><span class="mute">${new Date(p.creada).toLocaleDateString('es')}</span><span class="tag ${p.estado}">${p.estado==='aprobada'?'Aprobada +'+p.puntos+' pts':p.estado==='feedback'?'Con feedback':'En revisión'}</span></div>
  <p class="mute">Caso ${esc(p.numero_caso||'sin número')}</p><p>${esc(p.descripcion)}</p>${p.feedback?`<p><b>Feedback:</b> ${esc(p.feedback)}</p>`:''}${p.compromiso?`<p><b>Compromiso:</b> ${esc(p.compromiso)}</p>`:''}</div>`).join('')}
  </section></div>`;
}
function compet(rk,i,pts){
  const d=(H&&H.dias)||[],tot=d.reduce((a,x)=>a+x.indicadores.length,0),ok=d.reduce((a,x)=>a+x.indicadores.filter(y=>y.cumplido).length,0);
  const perf=x=>x.indicadores.length&&x.indicadores.every(y=>y.cumplido);
  let racha=0;for(const x of d){if(perf(x))racha++;else break}
  const mejor=d.reduce((a,x)=>Math.max(a,x.puntos),0);
  let g='';
  if(i>=0&&rk.length>1){
    if(i===0){const dif=pts-rk[1].puntos;g=`<span class="ic">🏆</span><span><b>¡Vas de primero!</b><br><span class="mute">${dif>0?`Tienes ${dif} pts de ventaja. Cada día cumplido la cuida.`:'Estás empatado en la cima. Un día más cumplido te separa.'}</span></span>`}
    else{const dif=rk[i-1].puntos-pts;g=`<span class="ic">🎯</span><span><b>${dif>0?`A ${dif} pts de subir al puesto ${i}`:`Empatado con el puesto ${i}`}</b><br><span class="mute">${rk[i+1]?`Tu ventaja sobre el puesto ${i+2}: ${pts-rk[i+1].puntos} pts.`:'Cumplir tus indicadores de hoy te acerca.'}</span></span>`}
  }
  return (g?`<div class="card gap">${g}</div>`:'')+`<div class="stats"><div><b>${d.filter(perf).length}</b><span>Días perfectos</span></div><div><b>${racha}</b><span>Racha de días perfectos</span></div><div><b>${tot?Math.round(ok/tot*100):0}%</b><span>Indicadores cumplidos</span></div><div><b>${mejor}</b><span>Mejor día (pts)</span></div></div>`;
}
function podio(rk){
  if(rk.length<3)return '';
  const t=[rk[1],rk[0],rk[2]],pos=[2,1,3];
  return `<div class="podio">${t.map((x,k)=>`<div class="c p${pos[k]} ${x.yo?'yo':''}"><div class="nm">${esc(x.nombre.split(' ').slice(0,2).join(' '))}${x.yo?' (tú)':''}</div><div class="bl">${['🥈','🥇','🥉'][k]}<small>${x.puntos} pts</small></div></div>`).join('')}</div>`;
}
function dias(){
  const d=(H&&H.dias)||[];
  if(!d.length) return '<p class="mute">Aún no hay resultados diarios cargados este mes.</p>';
  return d.map(x=>{const f=new Date(x.fecha+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}),n=x.indicadores.length,c=x.indicadores.filter(i=>i.cumplido).length,pf=n>0&&c===n,
  eq=x.eq_total?Math.round(x.eq_ok/x.eq_total*100):null,yo=n?Math.round(c/n*100):0,st=x.estrellas||[];
  return `<div class="card dia ${pf?'perf':''}"><div class="cab"><span><b>${esc(f)}</b><br><span class="big">${c}<small> de ${n} indicadores</small></span></span><span class="tot">+${x.puntos} pts${pf?'<br><span class="tag aprobada">Día perfecto</span>':''}</span></div>`
  +`<div class="seg" aria-hidden="true">${x.indicadores.map(i=>`<i class="${i.cumplido?'s':''}"></i>`).join('')}</div>`
  +(eq!=null?`<div class="cmp">Tú: ${yo}% · Equipo: ${eq}% ${yo>eq?'— por encima del equipo 👏':yo===eq?'— al ritmo del equipo':'— el equipo te saca ventaja, ¡mañana se recupera!'}</div>`:'')
  +x.indicadores.map(i=>`<div class="it"><span>${esc(i.nombre)}</span><span class="${i.cumplido?'si':'no'}">${i.cumplido?'✔ Cumplió · +'+i.puntos+' pts':'✘ No cumplió · 0 pts'}</span></div>`).join('')
  +(st.length?`<div class="star">⭐ Día perfecto de: ${st.map(n=>n===D.nombre?'<b>tú</b>':esc(n)).join(', ')}</div>`:'')+'</div>'}).join('');
}
async function postular(){
  const t=$('#t').value.trim(), c=$('#nc').value.trim();
  if(!c){alert('Debes escribir el número de caso');return} if(!t){alert('Describe la atención');return}
  try{await rpc('postular',{p_ced:S.ced,p_clave:S.clave,p_caso:c,p_texto:t});msg='Postulación enviada';await load()}catch(e){alert(e.message)}
}

// ---------- Vista del administrador ----------
const T={post:'Postulaciones',dia:'Cargar día',per:'Personas',ind:'Indicadores',inc:'Incentivos'};
function drawAdmin(){
  const v={
  post:()=>D.pendientes.map(p=>`<div class="card"><b>${esc(p.nombre)}</b> <span class="mute">· Caso ${esc(p.caso||'sin número')}</span><p>${esc(p.descripcion)}</p>
    <input id="f${p.id}" placeholder="Feedback"><input id="c${p.id}" placeholder="Compromiso de mejora"><button onclick="evaluar(${p.id},true)">Es increíble: dar 7 puntos</button> <button class="sec" onclick="evaluar(${p.id},false)">Enviar feedback</button></div>`).join('')||'<p class="mute">No hay postulaciones pendientes.</p>',
  dia:()=>`<div class="card"><label>Fecha<input id="fe" type="date" value="${new Date().toISOString().slice(0,10)}" oninput="avisoFecha()"></label><p id="aw" class="err" style="min-height:0"></p>
    <p class="mute">Una línea por registro: <code>cédula,indicador,1</code> (1 cumplió, 0 no cumplió).<br>Indicadores: ${D.indicadores.map(i=>esc(i.nombre)).join(', ')||'(crea uno primero)'}</p>
    <textarea id="lt" rows="8" placeholder="1012345678,Calidad,1"></textarea><button onclick="lote()">Guardar</button> <span class="ok" id="lm"></span></div>`+fechas(),
  per:()=>`<div class="card"><input id="uc" placeholder="Cédula"><input id="un" placeholder="Nombre"><input id="uk" placeholder="Clave (vacía = no cambiar)">
    <button onclick="g('admin_usuario',{p_ced:$('#uc').value.trim(),p_nombre:$('#un').value.trim(),p_clave:$('#uk').value})">Guardar persona</button></div>`
    +D.usuarios.map(u=>`<div class="card row"><span>${esc(u.nombre)} <span class="mute">${esc(u.cedula)}</span></span><button class="sec" onclick="del('usuarios','${esc(u.cedula)}')">Borrar</button></div>`).join(''),
  ind:()=>`<div class="card"><input id="in" placeholder="Nombre del indicador"><input id="ip" type="number" placeholder="Puntos por día cumplido">
    <button onclick="g('admin_indicador',{p_nombre:$('#in').value.trim(),p_puntos:+$('#ip').value})">Guardar indicador</button></div>`
    +D.indicadores.map(i=>`<div class="card row"><span>${esc(i.nombre)} · ${i.puntos} pts</span><button class="sec" onclick="del('indicadores',${i.id})">Borrar</button></div>`).join(''),
  inc:()=>`<div class="card"><p class="mute">Se crean para el mes actual (${esc(D.mes)}).</p><input id="xn" placeholder="Nombre"><input id="xp" placeholder="Premio"><input id="xm" type="number" placeholder="Meta de puntos">
    <button onclick="g('admin_incentivo',{p_nombre:$('#xn').value.trim(),p_premio:$('#xp').value.trim(),p_meta:+$('#xm').value})">Crear incentivo</button></div>`
    +D.incentivos.map(i=>`<div class="card row"><span>${esc(i.nombre)} · ${esc(i.premio)} · ${i.meta} pts <span class="mute">${esc(i.mes)}</span></span><button class="sec" onclick="del('incentivos',${i.id})">Borrar</button></div>`).join('')}[tab]();
  app.innerHTML=`<div class="top"><h1>Administración</h1><button class="sec" onclick="out()">Salir</button></div>
  <div class="tabs">${Object.entries(T).map(([k,n])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';drawAdmin()">${n}</button>`).join('')}</div>${v}
  <h2>Ranking actual</h2><div class="card">${D.ranking.map((x,j)=>`<div class="rk"><span class="n">${j+1}</span><span>${esc(x.nombre)}</span><span>${x.puntos} pts</span></div>`).join('')}</div>`;
  if(tab==='dia')avisoFecha();
}
const fdl=f=>{const p=f.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
function fechas(){
  if(!F)return '';
  const esp=F.usuarios*F.indicadores,ul=F.ultima?new Date(F.ultima).toLocaleString('es',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit'}):'sin registro';
  return `<h2>Fechas ya cargadas</h2><div class="card"><p class="mute">Revisa aquí antes de cargar para no repetir un día. Si cargas una fecha que ya existe, los resultados de esa fecha se reemplazan. Última carga: <b>${esc(ul)}</b>. Un día completo tiene ${esp} registros (${F.usuarios} personas × ${F.indicadores} indicadores).</p>`
  +(F.fechas.length?`<div style="overflow-x:auto"><table class="fch"><tr><th>Fecha</th><th>Registros</th><th>Personas</th><th>Cumplidos</th><th>Estado</th><th></th></tr>`
  +F.fechas.map(x=>{const ok=x.registros>=esp;return `<tr><td><b>${fdl(x.fecha)}</b></td><td>${x.registros}</td><td>${x.personas} de ${F.usuarios}</td><td>${x.registros?Math.round(x.cumplidos/x.registros*100):0}%</td><td><span class="est ${ok?'c':'i'}">${ok?'Completo':'Incompleto'}</span></td><td><button class="sec" onclick="$('#fe').value='${x.fecha}';avisoFecha();scrollTo(0,0)">Usar fecha</button></td></tr>`}).join('')+'</table></div>'
  :'<p class="mute">Aún no hay fechas cargadas.</p>')+'</div>';
}
function avisoFecha(){
  const a=$('#aw');if(!a||!F)return;const d=F.fechas.find(x=>x.fecha===$('#fe').value);
  a.textContent=d?`⚠ ${fdl(d.fecha)} ya tiene ${d.registros} registros cargados. Si guardas, se reemplazan los resultados de esa fecha.`:'';
}
async function g(fn,args){try{await rpc(fn,{p_admin:S.clave,...args});await load()}catch(e){alert(e.message)}}
const del=(t,id)=>confirm('¿Borrar? No se puede deshacer.')&&g('admin_borrar',{p_tabla:t,p_id:String(id)});
const evaluar=(id,ok)=>g('admin_evaluar',{p_id:id,p_ok:ok,p_puntos:7,p_feedback:$('#f'+id).value,p_compromiso:$('#c'+id).value});
async function lote(){
  const dup=F&&F.fechas.find(x=>x.fecha===$('#fe').value);
  if(dup&&!confirm(fdl(dup.fecha)+' ya tiene '+dup.registros+' registros cargados. ¿Quieres reemplazarlos con estos?'))return;
  const datos=$('#lt').value.split('\n').map(l=>l.split(',').map(s=>s.trim())).filter(a=>a.length>=3)
    .map(a=>({cedula:a[0],indicador:a[1],cumplido:a[2]==='1'}));
  try{const n=await rpc('admin_lote',{p_admin:S.clave,p_fecha:$('#fe').value,p_datos:datos});await load();tab='dia';drawAdmin();$('#lm').textContent=n+' registros guardados'}catch(e){alert(e.message)}
}
S?load():login();
</script>
