<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking de indicadores</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0f2a43;--mute:#5b6f82;--line:#d5dee8;--teal:#0e8f83;--gold:#e0a526;--coral:#d6543f;--purple:#7c4dff}
@media(prefers-color-scheme:dark){:root{--bg:#0c1a29;--card:#12263a;--ink:#e8eef5;--mute:#93a7ba;--line:#24405a}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Bricolage+Grotesque',system-ui,sans-serif;padding:18px}
main{max-width:780px;margin:0 auto;position:relative;z-index:1}
main.wide{max-width:1180px}
h1,h2,h3{margin:0;line-height:1.18}
h2{font-size:1.15rem;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(15,42,67,.04)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.hero{background:var(--ink);color:#fff;border-radius:12px;padding:22px;margin-bottom:8px}
.hero b{font-size:3.2rem;font-weight:800;display:block;line-height:1}
.hero span{color:#b9c7d6}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 10px}
button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:10px 16px;background:var(--teal);color:#fff;cursor:pointer;transition:transform .15s ease,opacity .2s ease}
button:hover{opacity:.94;transform:translateY(-1px)}
button:active{transform:none}
button.sec{background:transparent;color:var(--mute);border:1px solid var(--line)}
button.gold{background:linear-gradient(135deg,#f4c44e,#e0a526);color:#1d1808}
button.coral{background:var(--coral);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.track i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .6s}
.track.ok i{background:linear-gradient(90deg,#e0a526,#ffd56b)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rk{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:8px}
.rk .n{font-weight:800;font-size:1.1rem}
.mute{color:var(--mute);font-size:.92rem}
.tag{font-size:.78rem;padding:2px 9px;border-radius:20px;background:var(--line);display:inline-block;font-weight:600}
.tag.aprobada{background:var(--gold);color:#222}
.tag.rechazada{background:var(--coral);color:#fff}
.tag.pendiente{background:rgba(124,77,255,.16);color:var(--purple);border:1px solid rgba(124,77,255,.35)}
.tag.aceptada{background:rgba(14,143,131,.16);color:var(--teal);border:1px solid rgba(14,143,131,.35)}
.tag.oblig{background:rgba(214,84,63,.16);color:var(--coral);border:1px solid rgba(214,84,63,.45)}
.tag.badge-pill{background:linear-gradient(135deg,rgba(244,196,78,.28),rgba(224,165,38,.22));color:var(--ink);border:1px solid var(--gold)}
.tag.ind-goal{background:rgba(124,77,255,.14);color:var(--purple);border:1px solid rgba(124,77,255,.35)}
.tag.feedback,.tag.neg{background:var(--coral);color:#fff}
.tag.eq-trad{background:#1e6091;color:#fff}
.tag.eq-soc{background:var(--purple);color:#fff}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:9px 15px;border-radius:10px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 12px rgba(15,42,67,.18)}

.bell-wrap{position:relative;display:inline-block}
.bell-btn{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:9px 13px;border-radius:10px;display:inline-flex;align-items:center;gap:6px}
.bell-btn.has-alert{border-color:var(--gold);background:linear-gradient(135deg,rgba(244,196,78,.22),var(--card));box-shadow:0 0 0 2px rgba(224,165,38,.22)}
.bell-badge{background:var(--coral);color:#fff;font-size:.75rem;font-weight:800;padding:1px 7px;border-radius:999px;line-height:1.3}
.bell-pop{position:absolute;right:0;top:calc(100% + 8px);width:min(460px,94vw);max-height:78vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:14px;z-index:95}
.bell-sec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.bell-sec:first-of-type{margin-top:6px;padding-top:0;border-top:0}
.bell-item{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:6px;font-size:.88rem}

.live-pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(14,143,131,.14);color:var(--teal);border:1px solid rgba(14,143,131,.35)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulseDot 1.6s infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

.seg-switch{display:inline-flex;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--line);gap:4px;margin-bottom:10px}
.seg-switch button{padding:6px 12px;font-size:.85rem;background:transparent;color:var(--mute);border-radius:7px;transform:none}
.seg-switch button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}

.dia{padding:0;overflow:hidden}
.dia .cab{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line)}
.dia .cab b{text-transform:capitalize}
.dia .tot{font-weight:800;color:var(--teal);white-space:nowrap;text-align:right}
.dia .it{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.dia .it:last-child{border-bottom:0}
.dia .si{color:var(--teal);font-weight:700;white-space:nowrap}.dia .no{color:var(--coral);font-weight:700;white-space:nowrap}
.ind-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.pill-ind{font-size:.78rem;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.pill-ind.pro{border-color:rgba(14,143,131,.45);background:rgba(14,143,131,.1);color:var(--teal);font-weight:600}
.pill-ind.det{border-color:rgba(214,84,63,.45);background:rgba(214,84,63,.1);color:var(--coral);font-weight:600}

.gap{display:flex;gap:12px;align-items:center}
.gap .ic{font-size:1.8rem;line-height:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center}
.stats b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1}
.stats span{font-size:.8rem;color:var(--mute)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

/* Dashboard KPI & Breakdown */
.dash-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(15,42,67,.04)}
.kpi-card.k-ind{border-top:4px solid var(--teal)}
.kpi-card.k-mis{border-top:4px solid var(--purple)}
.kpi-card.k-inc{border-top:4px solid var(--gold)}
.kpi-card.k-tot{border-top:4px solid var(--ink);background:linear-gradient(145deg,rgba(14,143,131,.07),var(--card))}
.kpi-card .k-lbl{font-size:.82rem;color:var(--mute);font-weight:600}
.kpi-card .k-val{font-size:2rem;font-weight:800;line-height:1.1;margin:4px 0}
.kpi-card .k-sub{font-size:.8rem;color:var(--mute)}
@media(max-width:700px){.dash-kpis{grid-template-columns:repeat(2,1fr)}}
.split-bar{display:flex;height:24px;background:var(--line);border-radius:12px;overflow:hidden;margin:10px 0 8px}
.split-bar i{display:block;height:100%;transition:width .6s ease}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:760px){.dash-cols{grid-template-columns:1fr}}
.dash-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dash-row:last-child{border-bottom:0;padding-bottom:0}

.podio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-bottom:10px;min-height:190px}
.podio .c{text-align:center}
.podio .nm{font-size:.9rem;font-weight:600;margin-bottom:4px;overflow-wrap:anywhere}
.podio .bl{border-radius:10px 10px 0 0;background:var(--line);color:var(--ink);padding:10px 4px;font-weight:800;font-size:1.5rem}
.podio .bl small{display:block;font-size:.8rem;font-weight:600;color:var(--mute)}
.podio .p1 .bl{background:linear-gradient(180deg,#ffd66b,#e0a526);color:#222;height:120px}.podio .p1 .bl small{color:#4a3a10}
.podio .p2 .bl{height:90px}.podio .p3 .bl{height:68px}
.podio .yo .bl{background:var(--teal);color:#fff}.podio .yo .bl small{color:#d6f2ee}
.dia .big{font-size:1.85rem;font-weight:800;line-height:1.1}
.dia .big small{font-size:1rem;color:var(--mute);font-weight:600}
.dia .seg{display:flex;gap:5px;padding:10px 16px 4px}
.dia .seg i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.dia .seg i.s{background:var(--teal)}
.dia .cmp{padding:6px 16px 10px;font-size:.9rem;color:var(--mute)}
.dia .star{padding:10px 16px;background:rgba(224,165,38,.18);font-size:.9rem}
.dia.perf{border:2px solid var(--gold);box-shadow:0 0 18px rgba(224,165,38,.2)}

.lay{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:22px;align-items:start}
.lay aside{position:sticky;top:16px}
.lay h2:first-child{margin-top:0}
@media(max-width:860px){.lay{grid-template-columns:1fr}.lay aside{position:static}}
.rl{display:grid;grid-template-columns:28px 36px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px}
.rl+.rl{margin-top:2px}
.rl.yo{background:var(--teal);color:#fff}
.rl .pos{font-weight:800;text-align:center;font-size:1.05rem}
.av{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.rl.yo .av{background:rgba(255,255,255,.25)}
.rl .nm2{font-weight:600;font-size:.95rem;line-height:1.2;overflow-wrap:anywhere}
.rl .pt{font-weight:800;white-space:nowrap}
.rl .bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px}
.rl .bar i{display:block;height:100%;background:var(--teal)}
.rl.yo .bar{background:rgba(255,255,255,.3)}.rl.yo .bar i{background:#fff}

.hero.fr{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;background:linear-gradient(135deg,var(--teal),#0a6a62);box-shadow:0 8px 22px rgba(14,143,131,.2)}
.hero.fr b{display:inline;font-size:2.6rem}
.hero.fr span{color:#e3f6f3}
.hero.fr .em{font-size:3rem}

.upd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.upd b{font-weight:600}
.upd button{padding:5px 12px;font-size:.85rem;margin-left:auto}

.fch{width:100%;border-collapse:collapse;font-size:.92rem}
.fch th,.fch td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.fch th{color:var(--mute);font-weight:600;font-size:.82rem}
.fch button{padding:4px 10px;font-size:.82rem}
.est{font-size:.8rem;padding:2px 8px;border-radius:20px;white-space:nowrap}
.est.c{background:var(--teal);color:#fff}.est.i{background:var(--gold);color:#222}
.exp{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:10px}
.exp div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.exp b{display:block;font-size:1.02rem;margin-bottom:3px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin:6px 0 12px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sb{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:.9rem}
.sb .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .st{display:flex;height:20px;background:var(--line);border-radius:6px;overflow:hidden}
.sb .st i{display:block;height:100%}
.sb b{text-align:right}
@media(max-width:560px){.sb{grid-template-columns:96px 1fr 38px}}
.pz{width:100%;border-collapse:collapse;font-size:.9rem}
.pz th,.pz td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.pz th{color:var(--mute);font-size:.8rem;font-weight:600}
.pz tr.mv td{color:var(--mute);font-size:.86rem;padding-top:0}
.pz .n{font-weight:800}
.hm{border-collapse:separate;border-spacing:2px;font-size:.72rem}
.hm th{font-weight:600;color:var(--mute);padding:2px 3px;white-space:nowrap}
.hm td{min-width:30px;height:26px;text-align:center;border-radius:4px}
.hm td.nm{text-align:left;min-width:120px;padding-right:8px;white-space:nowrap;font-size:.82rem}
.dt{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:10px 0}
.dt div{background:var(--bg);border-radius:8px;padding:10px;font-size:.88rem}
.dt b{display:block;font-size:1.25rem}
.cmpb{display:grid;grid-template-columns:140px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
.cmpb .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.cmpb .tr i{display:block;height:100%}

#pop{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:60;pointer-events:none}
#pop button{pointer-events:auto}
#pop .tab{writing-mode:vertical-rl;background:var(--gold);color:#222;border-radius:12px 0 0 12px;padding:16px 10px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media(prefers-reduced-motion:no-preference){#pop .tab{animation:pl 2.4s ease-in-out infinite}}
@keyframes pl{0%,100%{padding-right:10px}50%{padding-right:16px}}
#pop .tz{position:absolute;right:46px;top:50%;transform:translateY(-50%);width:230px;background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:12px 14px;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:.9rem;pointer-events:auto}
#pop .tz button{padding:5px 12px;font-size:.85rem;margin-top:6px}
#pop .tz .x{position:absolute;top:2px;right:4px;background:none;color:var(--mute);padding:2px 8px;margin:0;font-size:1.1rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:none;pointer-events:none}
.ov.on{display:block;pointer-events:auto}
.dw{position:fixed;top:0;right:0;height:100%;width:min(420px,94vw);background:var(--card);border-left:1px solid var(--line);z-index:80;padding:20px;overflow:auto;transform:translateX(105%);transition:transform .3s;box-shadow:-8px 0 24px rgba(0,0,0,.25);visibility:hidden;pointer-events:none}
.dw.on{transform:none;visibility:visible;pointer-events:auto}
@media(prefers-reduced-motion:reduce){.dw{transition:none}}
.dw h2{margin:0 0 6px;font-size:1.3rem}
.dw .stp{display:grid;grid-template-columns:38px 1fr;gap:10px;margin:14px 0}
.dw .stp .no2{width:38px:height:38px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800}
.dw .stp.g .no2{background:var(--gold);color:#222}
.dw ul{margin:6px 0 0;padding-left:18px}
.dw .ex{background:var(--bg);border-radius:10px;padding:12px;font-size:.92rem}
.dw .cl{position:absolute;top:10px;right:12px;background:none;color:var(--mute);font-size:1.4rem;padding:2px 10px}

.mis{background:linear-gradient(135deg,#0e8f83,#0a5f8f);color:#fff;border:0;position:relative;overflow:hidden}
.mis h3{font-size:1.25rem;margin-bottom:4px}
.mis p{margin:4px 0 10px;color:#e3f6f3}
.mis .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.mis .chip{background:rgba(255,255,255,.18);border-radius:20px;padding:3px 12px;font-size:.85rem;font-weight:600}
.mis .chip.g{background:var(--gold);color:#222}
.mis .btns{display:flex;flex-wrap:wrap;gap:8px}
.mis button{background:#fff;color:#0a5f8f}
.mis button.sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
.card.gap{background:linear-gradient(135deg,rgba(14,143,131,.16),rgba(224,165,38,.2));border-color:var(--gold)}
.stats div:nth-child(1){border-top:4px solid var(--gold)}.stats div:nth-child(2){border-top:4px solid var(--coral)}.stats div:nth-child(3){border-top:4px solid var(--teal)}.stats div:nth-child(4){border-top:4px solid #4a7fd1}
.shd{display:flex;align-items:center;gap:8px;padding-left:10px;border-left:5px solid var(--gold);flex-wrap:wrap}
.shd .tag{background:var(--gold);color:#222;font-weight:800}

.inc{position:relative;border:2px solid rgba(224,165,38,.55);background:linear-gradient(145deg,rgba(255,215,105,.16),var(--card) 45%,rgba(224,165,38,.12));padding:18px 16px 15px;overflow:hidden;box-shadow:0 6px 20px rgba(224,165,38,.16)}
.inc::before{content:'';position:absolute;top:-60%;left:-60%;width:45%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:rotate(25deg);pointer-events:none}
@media(prefers-reduced-motion:no-preference){.inc::before{animation:shine 4.5s ease-in-out infinite}}
@keyframes shine{0%{left:-60%}55%,100%{left:140%}}
.inc .pr{display:flex;align-items:center;gap:12px}
.inc .pr .gift{font-size:2.5rem;line-height:1;filter:drop-shadow(0 2px 8px rgba(224,165,38,.45))}
.inc .pr b{font-size:1.28rem;display:block;line-height:1.15}
.inc .pr span{color:var(--mute);font-size:.9rem}
.inc .rb{position:absolute;top:0;right:0;background:linear-gradient(135deg,#f4c44e,#e0a526);color:#1f1805;font-size:.74rem;font-weight:800;letter-spacing:.04em;padding:5px 13px;border-radius:0 0 0 11px;box-shadow:0 2px 8px rgba(224,165,38,.35)}
.inc.cerca{border:2px solid #f5be38;box-shadow:0 0 0 3px rgba(224,165,38,.3),0 8px 24px rgba(224,165,38,.28)}
@media(prefers-reduced-motion:no-preference){.inc.cerca{animation:glw 2.2s ease-in-out infinite}}
@keyframes glw{50%{box-shadow:0 0 0 7px rgba(224,165,38,.14),0 10px 28px rgba(224,165,38,.36)}}
.inc.lg{border:2px solid #f5be38;background:linear-gradient(135deg,rgba(255,213,92,.32),rgba(224,165,38,.14));box-shadow:0 8px 26px rgba(224,165,38,.32)}
.inc .nums{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:12px 0 4px}
.inc .nums .big{font-size:2.3rem;font-weight:800;line-height:1;color:var(--teal)}
.inc.cerca .nums .big,.inc.lg .nums .big{color:#c98a0b}
@media(prefers-color-scheme:dark){.inc.cerca .nums .big,.inc.lg .nums .big{color:#ffd56b}}
.inc .track{height:16px;border-radius:8px}
.inc .how{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.9rem}
.inc .how ul{margin:4px 0 0;padding-left:18px}
.inc .how li{margin:2px 0}
.lider-box{background:rgba(124,77,255,.08);border:1px solid rgba(124,77,255,.32);border-radius:10px;padding:11px 12px;margin-top:10px;font-size:.9rem}

.ib{display:grid;grid-template-columns:1fr;gap:4px;padding:12px 16px}
.ib .tp{display:flex;justify-content:space-between;gap:10px}
.ib .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.ib .tr i{display:block;height:100%;border-radius:5px;transition:width .6s}
.opp{background:linear-gradient(135deg,rgba(214,84,63,.14),rgba(224,165,38,.16));border:1px dashed var(--coral)}
.err{color:var(--coral);font-weight:600;min-height:1.4em}
.ok{color:var(--teal);font-weight:600}

function norm(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
function jsArg(val){
  return JSON.stringify(String(val ?? ''));

function fmtDias(n){
  const num = Number(n) || 0;

function resolverDatosUsuario(cedula, nombreRaw=''){
  const cedStr = String(cedula || '').trim();
  const users = (D && Array.isArray(D.usuarios)) ? D.usuarios : [];
  const uMatch = users.find(u => String(u.cedula || '').trim() === cedStr);
  const nombreFinal = (uMatch && uMatch.nombre) || String(nombreRaw || '').trim() || (cedStr ? `Cédula ${cedStr}` : 'Usuario');
  const cedulaFinal = cedStr || ((uMatch && uMatch.cedula) ? String(uMatch.cedula) : '');
  return { cedula: cedulaFinal, nombre: nombreFinal };
}
function getEquipo(nombre, cedula=''){
  if(cedula && ASIGNACIONES_EQ['ced:' + String(cedula)]) return ASIGNACIONES_EQ['ced:' + String(cedula)];
  if(cedula && ASIGNACIONES_EQ[String(cedula)]) return ASIGNACIONES_EQ[String(cedula)];

  const n = norm(nombre);
  if(n){
    if(ASIGNACIONES_EQ['nom:' + n]) return ASIGNACIONES_EQ['nom:' + n];
    const parts = n.split(' ');
    const shortN = parts.length >= 2 ? parts[0] + ' ' + parts[parts.length - 1] : n;
    for(const [k, eq] of Object.entries(ASIGNACIONES_EQ)){
      if(k.startsWith('nom:')){
        const savedN = k.slice(4);
        if(savedN === n || savedN.includes(n) || n.includes(savedN) || (shortN.length > 4 && savedN.includes(shortN))){
          return eq;
        }
      }
    }
    if(EQUIPOS.tradicional.some(m => n === m || n.includes(m) || m.includes(n) || (shortN.length > 4 && m.includes(shortN)))) return 'tradicional';
    if(EQUIPOS.social.some(m => n === m || n.includes(m) || m.includes(n) || (shortN.length > 4 && m.includes(shortN)))) return 'social';
  }
  return 'general';
}

let audioCtx = null;
function playTone(type='info'){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    if(!audioCtx) audioCtx = new Ctx();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const notes = type==='success' ? [523.25, 659.25, 783.99]
                : type==='alert'   ? [587.33, 880, 587.33, 880]
                : type==='warn'    ? [330, 261.63]
                : [440, 554.37];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type==='warn' ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.12);
      gain.gain.setValueAtTime(0.001, now + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.12);
      osc.stop(now + idx * 0.12 + 0.23);
    });
  }catch(e){}
}

const recentNotifs = new Map();
function notify(title, body, type='info', actionHtml='', dedupKey='', minGapMs=12000){
  const key = dedupKey || `${title}::${body}`;
  const now = Date.now();
  const prev = recentNotifs.get(key) || 0;
  if(now - prev < minGapMs) return;
  recentNotifs.set(key, now);

  playTone(type);
  const box = document.getElementById('toast-box');
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='success'?'ok-t':type==='warn'?'warn-t':'');
  el.innerHTML = `<div><b>${esc(title)}</b><div style="font-size:.88rem;opacity:.92;margin-top:2px">${esc(body)}</div>${actionHtml}</div><button type="button" class="cls" aria-label="Cerrar" onclick="this.parentElement.remove()">×</button>`;
  box.appendChild(el);
  setTimeout(()=>{ if(el.parentElement) el.remove(); }, 9500);
}

async function rpc(fn,body){
  const r=await fetch(`${URL_}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const tx=await r.text(); let j=null; try{j=tx?JSON.parse(tx):null}catch(e){j={message:tx}}
  if(!r.ok) throw new Error((j&&j.message)||'Error de conexión'); return j;
}

function guardarPendienteLocalMision(misionId, cedula, nombre, nota='', solicitadaEn=null){
  const k = String(misionId);
  const res = resolverDatosUsuario(cedula, nombre);
  if(!MISIONES_PENDIENTES_LOCAL[k]) MISIONES_PENDIENTES_LOCAL[k] = [];
  const idx = MISIONES_PENDIENTES_LOCAL[k].findIndex(x => String(x.cedula) === res.cedula);
  const entry = {
    cedula: res.cedula,
    nombre: res.nombre,
    nota: String(nota || ''),
    solicitada_en: solicitadaEn || new Date().toISOString()
  };
  if(idx >= 0) MISIONES_PENDIENTES_LOCAL[k][idx] = { ...MISIONES_PENDIENTES_LOCAL[k][idx], ...entry };
  else MISIONES_PENDIENTES_LOCAL[k].push(entry);
  localStorage.setItem('misiones_pendientes_local', JSON.stringify(MISIONES_PENDIENTES_LOCAL));
}

function quitarPendienteLocalMision(misionId, cedula){
  const k = String(misionId);
  if(!MISIONES_PENDIENTES_LOCAL[k]) return;
  MISIONES_PENDIENTES_LOCAL[k] = MISIONES_PENDIENTES_LOCAL[k].filter(x => String(x.cedula) !== String(cedula));
  localStorage.setItem('misiones_pendientes_local', JSON.stringify(MISIONES_PENDIENTES_LOCAL));
}

function getEstadoLocalMision(misionId){
  if(!S || !S.ced) return null;
  return (MISIONES_LOCAL[String(S.ced)] && MISIONES_LOCAL[String(S.ced)][String(misionId)]) || null;
}
function setEstadoLocalMision(misionId, estado){
  if(!S || !S.ced) return;
  const k = String(S.ced);
  if(!MISIONES_LOCAL[k]) MISIONES_LOCAL[k] = {};
  MISIONES_LOCAL[k][String(misionId)] = estado;
  localStorage.setItem('misiones_estado_local', JSON.stringify(MISIONES_LOCAL));
}
function saveMetaLocalMision(titulo, obligatoria, asignacionTipo, asignadosCedulas, insigniaNombre, insigniaIcono){
  MISIONES_META_LOCAL[norm(titulo)] = {
    obligatoria: !!obligatoria,
    asignacion_tipo: asignacionTipo || 'todos',
    asignados_cedulas: asignadosCedulas || [],
    insignia_nombre: insigniaNombre || ('Insignia: ' + titulo),
    insignia_icono: insigniaIcono || '🏅'
  };
  localStorage.setItem('misiones_meta_local', JSON.stringify(MISIONES_META_LOCAL));
}
function enrichMisiones(rawList){
  return (rawList || []).map(m => {
    const titulo = m.titulo || m.nombre || 'Misión';
    const metaLoc = MISIONES_META_LOCAL[norm(titulo)] || {};
    const obligatoria = typeof m.obligatoria === 'boolean' ? m.obligatoria : !!metaLoc.obligatoria;
    const asignacion_tipo = m.asignacion_tipo || metaLoc.asignacion_tipo || 'todos';
    const asignados_cedulas = Array.isArray(m.asignados_cedulas) && m.asignados_cedulas.length
      ? m.asignados_cedulas.map(String)
      : (metaLoc.asignados_cedulas || []).map(String);
    const insignia_nombre = (m.insignia_nombre && m.insignia_nombre.trim()) || metaLoc.insignia_nombre || ('Insignia: ' + titulo);
    const insignia_icono = (m.insignia_icono && m.insignia_icono.trim()) || metaLoc.insignia_icono || '🏅';

    const remPend = Array.isArray(m.pendientes_validacion) ? m.pendientes_validacion : [];
    const locPend = MISIONES_PENDIENTES_LOCAL[String(m.id)] || [];
    const completadosNorm = new Set((m.completados || []).map(c => norm(c)));
    const mapPend = new Map();

    [...remPend, ...locPend].forEach(pv => {
      if(!pv) return;
      const res = resolverDatosUsuario(pv.cedula, pv.nombre);
      if(!res.cedula && !pv.nombre) return;
      if(completadosNorm.has(norm(res.nombre))) return;
      const key = res.cedula || norm(res.nombre);
      if(!mapPend.has(key)){
        mapPend.set(key, {
          ...pv,
          cedula: res.cedula,
          nombre: res.nombre
        });
      }
    });

    return {
      ...m,
      titulo,
      obligatoria,
      asignacion_tipo,
      asignados_cedulas,
      insignia_nombre,
      insignia_icono,
      pendientes_validacion: Array.from(mapPend.values())
    };
  });
}

function saveMetaLocalIncentivo(id, nombre, tipoMeta, indicadorNombre, metaIndicador, corteIndicador){
  const key = id ? ('id:' + String(id)) : ('nom:' + norm(nombre));
  INCENTIVOS_META_LOCAL[key] = {
    tipo_meta: tipoMeta || 'puntos',
    indicador_nombre: tipoMeta === 'indicador' ? (indicadorNombre || '') : '',
    meta_indicador: tipoMeta === 'indicador' ? (metaIndicador || '') : '',
    corte_indicador: tipoMeta === 'indicador' ? (corteIndicador || 'Cierre de mes') : ''
  };
  localStorage.setItem('incentivos_meta_local', JSON.stringify(INCENTIVOS_META_LOCAL));
}

function enrichIncentivo(inc){
  const loc = INCENTIVOS_META_LOCAL['id:' + String(inc.id)] || INCENTIVOS_META_LOCAL['nom:' + norm(inc.nombre)] || {};
  const tipo_meta = inc.tipo_meta || loc.tipo_meta || 'puntos';
  const indicador_nombre = (inc.indicador_nombre && inc.indicador_nombre.trim()) || loc.indicador_nombre || '';
  const meta_indicador = (inc.meta_indicador && String(inc.meta_indicador).trim()) || loc.meta_indicador || '';
  const corte_indicador = (inc.corte_indicador && inc.corte_indicador.trim()) || loc.corte_indicador || 'Cierre de mes';
  return { ...inc, tipo_meta, indicador_nombre, meta_indicador, corte_indicador };
}

function getValidacionIncentivoUsuario(incId, ced){
  const c = String(ced || (S && S.ced) || '');
  const rem = (VALIDACIONES_INC || []).find(v => String(v.incentivo_id) === String(incId) && String(v.cedula) === c);
  if(rem) return rem;
  const loc = INCENTIVOS_VAL_LOCAL[c] && INCENTIVOS_VAL_LOCAL[c][String(incId)];
  return loc || null;
}

function setValidacionLocalIncentivo(incId, ced, data){
  const c = String(ced || (S && S.ced) || '');
  if(!INCENTIVOS_VAL_LOCAL[c]) INCENTIVOS_VAL_LOCAL[c] = {};
  INCENTIVOS_VAL_LOCAL[c][String(incId)] = {
    incentivo_id: incId,
    cedula: c,
    ...(INCENTIVOS_VAL_LOCAL[c][String(incId)] || {}),
    ...data
  };
  localStorage.setItem('incentivos_val_local', JSON.stringify(INCENTIVOS_VAL_LOCAL));
}

function getPendientesMisionesAdmin(){
  const list = [];
  const seen = new Set();
  (MISIONES || []).forEach(m => {
    (m.pendientes_validacion || []).forEach(pv => {
      const res = resolverDatosUsuario(pv.cedula, pv.nombre);
      const uniqueKey = `${m.id}::${res.cedula || norm(res.nombre)}`;
      if(seen.has(uniqueKey)) return;
      seen.add(uniqueKey);
      list.push({
        ...pv,
        cedula: res.cedula,
        nombre: res.nombre,
        mision_id: m.id,
        mision_titulo: m.titulo,
        mision_puntos: m.puntos,
        insignia_nombre: m.insignia_nombre,
        insignia_icono: m.insignia_icono
      });
    });
  });
  return list;
}

function getPendientesIncentivosAdmin(){

function esMisionParaUsuario(m){
  if(!S || !S.ced) return true;
  if(m.asignacion_tipo === 'algunos'){
    const lista = (m.asignados_cedulas || []).map(String);
    return lista.includes(String(S.ced));
  }
  return true;
}

  if(D && Array.isArray(D.incentivos)){
    D.incentivos = D.incentivos.map(enrichIncentivo);

    const rawM = await rpc('listar_misiones', S.a ? {p_admin:S.clave, p_ced:null} : {p_admin:null, p_ced:S.ced}) || [];

  try{

  }catch(e){ NEGATIVOS = []; }
  try{
    const vals = await rpc('listar_validaciones_incentivos', S.a ? {p_admin:S.clave, p_ced:null} : {p_admin:null, p_ced:S.ced});
    if(Array.isArray(vals)) VALIDACIONES_INC = vals;
  }catch(e){}
  try{

      if(r.cedula && r.equipo) freshMap['ced:' + String(r.cedula)] = r.equipo;
      if(r.nombre && r.equipo) freshMap['nom:' + norm(r.nombre)] = r.equipo;
    });
    ASIGNACIONES_EQ = { ...ASIGNACIONES_EQ, ...freshMap };
    localStorage.setItem('eq_map', JSON.stringify(ASIGNACIONES_EQ));
  }catch(e){}
  try{
    const cfg = await rpc('obtener_config_ranking', {});
    if(cfg && typeof cfg.puntos_atencion_increible === 'number'){
      PTS_INCREIBLE = cfg.puntos_atencion_increible;
      localStorage.setItem('pts_increible', String(PTS_INCREIBLE));
    }
  }catch(e){}
}

function buildSignature(d, h, mis, vals){
  const posts = ((d && d.postulaciones) || []).map(p=>`${p.id}:${p.estado}`).join('|');
  const pend = ((d && d.pendientes) || []).map(p=>`${p.id}`).join(',');
  const upd = h && h.actualizado ? h.actualizado : '';
  const rk = ((d && d.ranking) || []).map(r=>`${r.nombre}:${r.puntos}`).join('|');
  const mSig = (mis||[]).map(m=>`${m.id}:${m.estado_usuario||''}:${(m.pendientes_validacion||[]).map(x=>x.cedula).join(',')}:${(m.completados||[]).length}:${m.completada?1:0}`).join('|');
  const vSig = (vals||[]).map(v=>`${v.incentivo_id}:${v.cedula}:${v.estado}`).join('|');
  return `${upd}::${posts}::${pend}::${rk}::${mSig}::${vSig}`;
}

function detectarYNotificarCambios(prevState, nextState){
  if(!prevState || !S) return;

  if(!S.a){
    const prevMisIds = new Set((prevState.misiones || []).filter(esMisionParaUsuario).map(m => String(m.id)));
    (nextState.misiones || []).filter(esMisionParaUsuario).forEach(m => {
      if(!prevMisIds.has(String(m.id))){
        notify(
          '🚀 ¡Nueva misión publicada!',
          `${m.titulo} (+${m.puntos} pts · ${m.insignia_icono} ${m.insignia_nombre})`,
          'alert',
          `<button type="button" class="gold" data-user-tab="misiones">Ver misión</button>`,
          `mis-new-${m.id}`
        );
      }else{
        const oldM = (prevState.misiones || []).find(x => String(x.id) === String(m.id));
        const fueAprobada = (!oldM || !oldM.completada) && !!m.completada;
        const fueRechazada = (!oldM || oldM.estado_usuario !== 'rechazada') && m.estado_usuario === 'rechazada';
        if(fueAprobada){
          notify(
            '🏅 ¡Misión validada!',
            `Ganaste +${m.puntos} pts y tu insignia ${m.insignia_icono} ${m.insignia_nombre}.`,
            'success',
            '',
            `mis-val-${m.id}`
          );
        }else if(fueRechazada){
          setEstadoLocalMision(m.id, 'rechazada');
          notify(
            '❌ Misión rechazada',
            `Tu solicitud en "${m.titulo}" fue rechazada y la misión quedó cerrada.`,
            'warn',
            '',
            `mis-rej-${m.id}`
          );
        }
      }
    });

    const oldMap = {};
    ((prevState.D && prevState.D.postulaciones) || []).forEach(p => oldMap[p.id] = p.estado);
    ((nextState.D && nextState.D.postulaciones) || []).forEach(p => {
      if(oldMap[p.id] && oldMap[p.id] === 'pendiente' && p.estado !== 'pendiente'){
        if(p.estado === 'aprobada'){
          notify('🎉 ¡Postulación aprobada!', `Tu caso ${p.numero_caso||''} ganó +${p.puntos} puntos.`, 'success', '', `post-ok-${p.id}`);
        }else{
          notify('💬 Respuesta a tu postulación', `Tienes nuevo feedback en el caso ${p.numero_caso||''}.`, 'info', '', `post-fb-${p.id}`);
        }
      }
    });
  }else{
    const prevPendIds = new Set(((prevState.D && prevState.D.pendientes) || []).map(p => String(p.id)));
    ((nextState.D && nextState.D.pendientes) || []).forEach(p => {
      if(!prevPendIds.has(String(p.id))){
        const res = resolverDatosUsuario(p.cedula, p.nombre);
        notify(
          `🌟 Postulación de ${res.nombre}`,
          `CC ${res.cedula || 'N/A'} · Caso ${p.caso || 'sin número'}.`,
          'alert',
          `<button type="button" class="gold" onclick="bellOpen=true;drawAdmin()">Abrir campana</button>`,
          `adm-post-${p.id}`,
          20000
        );
      }
    });

    const prevMisPend = new Set();
    (prevState.misiones || []).forEach(m => (m.pendientes_validacion || []).forEach(pv => {
      const res = resolverDatosUsuario(pv.cedula, pv.nombre);
      prevMisPend.add(`${m.id}:${res.cedula || norm(res.nombre)}`);
    }));
    (nextState.misiones || []).forEach(m => (m.pendientes_validacion || []).forEach(pv => {
      const res = resolverDatosUsuario(pv.cedula, pv.nombre);
      const key = `${m.id}:${res.cedula || norm(res.nombre)}`;
      if(!prevMisPend.has(key)){
        notify(
          `🚀 Solicitud de ${res.nombre}`,
          `CC ${res.cedula || 'N/A'} marcó "${m.titulo}" para validación del líder.`,
          'alert',
          `<button type="button" class="gold" onclick="bellOpen=true;drawAdmin()">Validar en campana</button>`,
          `adm-mis-${m.id}-${res.cedula || norm(res.nombre)}`,
          20000
        );
      }
    }));

    const prevValPend = new Set((prevState.vals || []).filter(v => v.estado === 'pendiente').map(v => `${v.incentivo_id}:${v.cedula}`));
    (nextState.vals || []).filter(v => v.estado === 'pendiente').forEach(v => {
      if(!prevValPend.has(`${v.incentivo_id}:${v.cedula}`)){
        const res = resolverDatosUsuario(v.cedula, v.nombre);
        notify(
          `🎯 Corte de ${res.nombre}`,
          `CC ${res.cedula || 'N/A'} solicitó validar "${v.incentivo_nombre || 'Incentivo'}".`,
          'alert',
          `<button type="button" class="gold" onclick="bellOpen=true;drawAdmin()">Validar en campana</button>`,
          `adm-inc-${v.incentivo_id}-${v.cedula}`,
          20000
        );
      }
    });
  }
}

async function syncState({ silent=false, allowNotif=true } = {}){
  if(!S) return;
  const prevState = D ? {
    D: JSON.parse(JSON.stringify(D)),
    misiones: JSON.parse(JSON.stringify(MISIONES)),
    vals: JSON.parse(JSON.stringify(VALIDACIONES_INC))
  } : null;

  const nextD = S.a
    ? await rpc('admin_panel', {p_admin: S.clave})
    : await rpc('mi_panel', {p_ced: S.ced, p_clave: S.clave});

  let nextH = null;
  if(!S.a){
    try{ nextH = await rpc('mi_historial', {p_ced: S.ced, p_clave: S.clave}); }catch(e){}
  }

  let nextF = F, nextG = G;
  if(S.a && !silent){
    try{ nextF = await rpc('admin_fechas', {p_admin: S.clave}); }catch(e){}
    try{ nextG = await rpc('admin_detalle', {p_admin: S.clave}); }catch(e){}
  }

  D = nextD;
  if(nextH !== null) H = nextH;
  if(nextF !== null) F = nextF;
  if(nextG !== null) G = nextG;

  await loadExtras();

  const nextState = { D, misiones: MISIONES, vals: VALIDACIONES_INC };
  const sig = buildSignature(D, H, MISIONES, VALIDACIONES_INC);

  if(prevState && sig !== lastSignature){
    if(allowNotif){
      detectarYNotificarCambios(prevState, nextState);
    }
    if(S.a){
      try{
        F = await rpc('admin_fechas', {p_admin: S.clave});
        G = await rpc('admin_detalle', {p_admin: S.clave});
      }catch(e){}
    }
    draw();
  }else if(!prevState){
    draw();
  }

  lastSignature = sig;
}

function scheduleRealtimeSync(allowNotif=true){
  if(syncDebounce) clearTimeout(syncDebounce);
  syncDebounce = setTimeout(async ()=>{
    try{
      await syncState({ silent: false, allowNotif });
    }catch(e){}
  }, 180);
}

      `<button type="button" class="gold" onclick="bellOpen=true;tab='post';drawAdmin()">Ver en campana</button>`,
      `evt-post-${res.cedula}-${payload?.caso || ''}`,
      20000
    );
    scheduleRealtimeSync(false);
  });

  rtChannel.on('broadcast', { event: 'reto_completado' }, ({ payload }) => {
    if(!S || !S.a) return;
    const res = resolverDatosUsuario(payload?.cedula, payload?.nombre);
    const mId = payload?.mision_id;
    const mTit = payload?.mision_titulo || 'una misión';
    if(mId && res.cedula){
      guardarPendienteLocalMision(mId, res.cedula, res.nombre, payload?.nota || '', payload?.solicitada_en || new Date().toISOString());

      `evt-reto-${res.cedula}-${mId || ''}`,
      20000
    );
    scheduleRealtimeSync(false);
  });

  rtChannel.on('broadcast', { event: 'corte_incentivo_enviado' }, ({ payload }) => {
    if(!S || !S.a) return;
    const res = resolverDatosUsuario(payload?.cedula, payload?.nombre);
    notify(
      `🎯 Corte de ${res.nombre}`,
      `CC ${res.cedula || 'N/A'} solicitó validar "${payload?.incentivo || 'un incentivo'}".`,
      'alert',
      `<button type="button" class="gold" onclick="bellOpen=true;tab='inc';drawAdmin()">Validar en campana</button>`,
      `evt-corte-${res.cedula}-${payload?.incentivo || ''}`,
      20000
    );
    scheduleRealtimeSync(false);
  });

  rtChannel.on('broadcast', { event: 'validacion_resuelta' }, ({ payload }) => {
    if(!S || S.a) return;
    if(payload?.cedula && String(payload.cedula) !== String(S.ced)) return;
    if(payload?.mision_id){
      setEstadoLocalMision(payload.mision_id, payload.aprobada ? 'aprobada' : 'rechazada');
    }
    notify(
      payload?.aprobada ? '✅ ¡Validación aprobada!' : '❌ Misión rechazada',
      payload?.mensaje || (payload?.aprobada ? 'El administrador aprobó tu misión.' : 'El administrador rechazó tu solicitud y cerró la misión.'),

    );
    scheduleRealtimeSync(false);
  });

  const tablas = ['misiones', 'postulaciones', 'misiones_usuarios', 'validaciones_incentivos', 'resultados_diarios', 'negativos'];
  tablas.forEach(tabla => {
    rtChannel.on('postgres_changes', { event: '*', schema: 'public', table: tabla }, () => {
      scheduleRealtimeSync(true);
    });
  });

  rtChannel.subscribe((status) => {
    rtConnected = status === 'SUBSCRIBED';

      pill.innerHTML = `<span class="live-dot"></span>${rtConnected ? 'Tiempo real activo' : 'Conectando...'}`;

function getDesglosePuntosUsuario(ptsRankingTotal=0){
  const inds = (D && Array.isArray(D.indicadores)) ? D.indicadores : [];
  const d = (H && Array.isArray(H.dias)) ? H.dias : [];
  const st = {};
  d.forEach(x => (x.indicadores || []).forEach(i => {
    const q = st[i.nombre] = st[i.nombre] || { ok: 0, t: 0 };
    q.t++;
    if(i.cumplido) q.ok++;
  }));

  const detalleIndicadores = inds.map(i => {
    const diasCumplidos = Number(i.dias) || (st[i.nombre] ? st[i.nombre].ok : 0);
    const diasTotales = st[i.nombre] ? st[i.nombre].t : diasCumplidos;
    const ptsGanados = diasCumplidos * (Number(i.puntos) || 0);
    return {
      nombre: i.nombre,
      valorDia: Number(i.puntos) || 0,
      diasCumplidos,
      diasTotales,
      puntos: ptsGanados
    };
  });
  const ptsIndicadores = detalleIndicadores.reduce((acc, x) => acc + x.puntos, 0);

  const misionesAprobadas = getInsigniasGanadasUsuario();
  const detalleMisiones = misionesAprobadas.map(m => ({
    titulo: m.titulo,
    icono: m.insignia_icono || '🏅',
    insignia: m.insignia_nombre || '',
    puntos: Number(m.puntos) || 0
  }));
  const ptsMisiones = detalleMisiones.reduce((acc, x) => acc + x.puntos, 0);

  const atencionesAprobadas = ((D && Array.isArray(D.postulaciones)) ? D.postulaciones : []).filter(p => p.estado === 'aprobada');
  const ptsAtenciones = atencionesAprobadas.reduce((acc, p) => acc + (Number(p.puntos) || PTS_INCREIBLE), 0);

  const sumaCalculada = ptsIndicadores + ptsMisiones + ptsAtenciones;
  const totalReal = Math.max(Number(ptsRankingTotal) || 0, sumaCalculada);

  return {
    ptsIndicadores,
    ptsMisiones,
    ptsAtenciones,
    totalReal,
    detalleIndicadores,
    detalleMisiones,
    atencionesAprobadas
  };
}

function getMisionesUsuarioPorNombre(nombre, cedula=''){
  const nNorm = norm(nombre);
  const cedStr = String(cedula || '').trim();
  const ganadas = [];
  (MISIONES || []).forEach(m => {
    const compList = Array.isArray(m.completados) ? m.completados : [];
    const enCompletados = compList.some(c => norm(c) === nNorm);
    const locAprobada = cedStr && MISIONES_LOCAL[cedStr] && MISIONES_LOCAL[cedStr][String(m.id)] === 'aprobada';
    if(enCompletados || locAprobada){
      ganadas.push({
        id: m.id,
        titulo: m.titulo,
        puntos: Number(m.puntos) || 0,
        icono: m.insignia_icono || '🏅'
      });
    }
  });
  return {
    cantidad: ganadas.length,
    puntos: ganadas.reduce((a, b) => a + b.puntos, 0),
    lista: ganadas
  };
}

function tiempoRestante(fechaLimite){
  if(!fechaLimite) return 'Sin límite de tiempo';
  const diff = new Date(fechaLimite) - new Date();
  if(diff <= 0) return 'Tiempo agotado';
  const hrs = Math.floor(diff / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  if(hrs >= 24) return `Quedan ${Math.floor(hrs/24)}d ${hrs%24}h ${mins}m`;
  return `Quedan ${hrs}h ${mins}m`;
}

function seccionRetosUsuario(){
  const lista = getMisionesVisiblesUsuario();
  if(!lista.length) return '<div class="card"><p class="mute" style="margin:0">No hay misiones activas o pendientes por mostrar en este momento.</p></div>';

  return lista.map(m => {
    const completada = m._est === 'aprobada' || !!m.completada;
    const rechazada = !completada && m._est === 'rechazada';
    const pendienteVal = !completada && !rechazada && m._est === 'pendiente';
    const vencidaSinCompletar = !completada && !rechazada && !pendienteVal && !!(m.fecha_limite && new Date(m.fecha_limite) < new Date());
    const aceptada = !completada && !rechazada && !pendienteVal && !vencidaSinCompletar && (m._est === 'aceptada' || m.obligatoria);
    const cardCls = completada ? 'done' : (rechazada || vencidaSinCompletar) ? 'oblig-card' : m.obligatoria ? 'oblig-card' : aceptada ? 'accepted' : '';

    return `<div class="card reto-card ${cardCls}">
      <div class="row">
        <div>
          <b style="font-size:1.1rem">${esc(m.titulo)}</b>
          <span class="tag ${completada?'aprobada':(rechazada||vencidaSinCompletar)?'rechazada':pendienteVal?'pendiente':aceptada?'aceptada':''}" style="margin-left:6px">
            ${rechazada ? 'Rechazada' : vencidaSinCompletar ? 'Fuera de tiempo' : '+' + m.puntos + ' pts'}
          </span>
          <span class="tag badge-pill" style="margin-left:4px">${esc(m.insignia_icono)} ${esc(m.insignia_nombre)}</span>
          ${m.obligatoria
            ? '<span class="tag oblig" style="margin-left:4px">🔒 Misión obligatoria</span>'
            : '<span class="tag" style="margin-left:4px">Opcional</span>'}
        </div>
        <span class="timer-pill" data-deadline="${esc(m.fecha_limite||'')}">⏳ ${rechazada ? 'Misión cerrada' : vencidaSinCompletar ? 'Tiempo agotado' : esc(tiempoRestante(m.fecha_limite))}</span>
      </div>
      ${m.descripcion ? `<p style="margin:6px 0">${esc(m.descripcion)}</p>` : ''}
      <div class="ev-box">
        <b>📸 Evidencia:</b> ${m.obligatoria ? 'Esta misión es <b>obligatoria</b> y no se puede omitir. ' : ''}Envía la foto/captura al jefe y marca que la completaste para validar tus puntos y desbloquear tu insignia.
      </div>
      <div style="margin-top:8px">
        ${completada
          ? `<div class="row">
               <span class="ok">✔ ¡Misión completada y validada! Insignia ganada: <b>${esc(m.insignia_icono)} ${esc(m.insignia_nombre)}</b></span>
               <button type="button" class="gold" onclick='copiarImagenLogro(${jsArg(m.titulo)}, ${Number(m.puntos)||0}, ${jsArg(m.insignia_icono)}, ${jsArg(m.insignia_nombre)})'>📤 Compartir imagen de logro</button>
             </div>`
          : rechazada
            ? `<div class="row">
                 <span class="tag neg">❌ Rechazada</span>
                 <span class="mute">Misión cerrada por el administrador.</span>
               </div>`
          : vencidaSinCompletar
            ? `<div class="row">
                 <span class="tag neg">⏰ No completada por fuera de tiempo</span>
                 <span class="mute">Misión cerrada porque se acabó el tiempo antes de completarla.</span>
               </div>`
          : pendienteVal
            ? `<span class="tag pendiente">⏳ Completada · Esperando validación del líder</span>`
            : aceptada
              ? `<div>
                   <label for="ev-nota-${m.id}" style="font-size:.85rem">Evidencia o nota (opcional)</label>
                   <input id="ev-nota-${m.id}" placeholder="Opcional: escribe enlace o detalle de tu evidencia enviada al jefe">

async function omitirMision(misionId, titulo){
  const mObj = MISIONES.find(x => x.id === misionId);
  if(mObj && mObj.obligatoria){
    alert('Esta misión es obligatoria y no se puede omitir.');
    return;
  }
  setEstadoLocalMision(misionId, 'omitida');
  notify('⏭️ Misión omitida', `Omitiste "${titulo}". No aparecerá en tu lista activa.`, 'info');
  try{
    await rpc('responder_mision', {
      p_ced: S.ced, p_clave: S.clave, p_mision_id: misionId, p_accion: 'omitir', p_nota: ''
    });
  }catch(e){}
  drawUser();
}

async function marcarMisionCompletada(misionId, tituloMision='Misión'){
  const mObj = MISIONES.find(x => Number(x.id) === Number(misionId));
  if(mObj && mObj.fecha_limite && new Date(mObj.fecha_limite) < new Date()){
    alert('El tiempo de esta misión ya se agotó y quedó cerrada como no completada por fuera de tiempo.');
    drawUser();
    return;
  }

  const elNota = $('#ev-nota-' + misionId);
  const nota = elNota ? elNota.value.trim() : '';
  const res = resolverDatosUsuario(S.ced, D && D.nombre);
  const ahoraIso = new Date().toISOString();

  setEstadoLocalMision(misionId, 'pendiente');
  guardarPendienteLocalMision(misionId, res.cedula, res.nombre, nota, ahoraIso);
  MISIONES = enrichMisiones(MISIONES);

  broadcastEvent('reto_completado', {
    cedula: res.cedula,
    nombre: res.nombre,
    mision_id: misionId,
    mision_titulo: tituloMision,
    nota,
    solicitada_en: ahoraIso
  });

  try{
    await rpc('responder_mision', {
      p_ced: S.ced, p_clave: S.clave, p_mision_id: misionId, p_accion: 'solicitar', p_nota: nota
    });
  }catch(e){
    try{
      await rpc('solicitar_mision', {
        p_ced: S.ced, p_clave: S.clave, p_mision_id: misionId, p_nota: nota
      });
    }catch(err){}
  }

  notify('🚀 Enviado a validación del líder', `Quedó registrado que ${res.nombre} marcó "${tituloMision}" como completada.`, 'success', '', `mis-env-${misionId}`);
  await syncState({ silent: false, allowNotif: false });
}

async function copiarImagenLogro(tituloMision, puntos, iconoInsignia='🏅', nombreInsignia='Insignia de Misión', subtituloExtra=''){
  try{
    const canvas = document.createElement('canvas');
    canvas.width = 900; canvas.height = 480;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 900, 480);
    grad.addColorStop(0, '#0f2a43');
    grad.addColorStop(1, '#0e8f83');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 900, 480);

    ctx.strokeStyle = '#e0a526';
    ctx.lineWidth = 10;
    ctx.strokeRect(24, 24, 852, 432);

    ctx.fillStyle = '#e0a526';
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.fillText('🏆 LOGRO VALIDADO · OPERACIÓN', 60, 82);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px system-ui, sans-serif';
    ctx.fillText(D.nombre, 60, 152);

    ctx.fillStyle = '#b9c7d6';
    ctx.font = '24px system-ui, sans-serif';
    ctx.fillText(subtituloExtra || 'Logro completado y validado:', 60, 206);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 32px system-ui, sans-serif';
    ctx.fillText(`"${tituloMision}"`, 60, 252);

    ctx.fillStyle = 'rgba(224,165,38,0.22)';
    ctx.beginPath();
    ctx.roundRect(60, 274, 780, 48, 12);
    ctx.fill();
    ctx.fillStyle = '#ffd56b';
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(`${iconoInsignia} ${nombreInsignia}`, 78, 306);

    ctx.fillStyle = '#e0a526';
    ctx.beginPath();
    ctx.roundRect(60, 342, 240, 62, 31);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillText(puntos > 0 ? `+${puntos} PUNTOS` : 'VALIDADO', 84, 383);

    ctx.fillStyle = '#e3f6f3';
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillText(`Equipo: ${getEquipo(D.nombre, S.ced).toUpperCase()} · ${new Date().toLocaleDateString('es')}`, 330, 381);

    canvas.toBlob(async blob => {
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        notify('📤 ¡Imagen de logro lista!', 'Se copió la imagen al portapapeles; pégala (Ctrl+V) para compartirla.', 'success');
      }catch(err){
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `logro-${norm(tituloMision)}.png`;
        a.click();
        notify('📥 Imagen descargada', 'Se descargó la imagen de logro para que la compartas.', 'info');
      }
    }, 'image/png');
  }catch(e){
    alert('No se pudo generar la imagen de logro.');
  }
}

function construirTableroGeneralConducta(filtroEq='global'){
  const personas = (D && D.ranking) ? D.ranking : [];
  const filtradas = filtroEq==='global'

  const conteoPorNombre = {};

  });

  return `<div class="board-grid">` + filtradas.map(p => {
    const k = norm(p.nombre);
    const ptsNeg = conteoPorNombre[k] || 0;

    return `<div class="board-tile ${cls}">

  }).join('') + `</div>`;
}

function compet(rk,i,pts){
  const d=(H&&H.dias)||[],tot=d.reduce((a,x)=>a+x.indicadores.length,0),ok=d.reduce((a,x)=>a+x.indicadores.filter(y=>y.cumplido).length,0);
  const perf=x=>x.indicadores.length&&x.indicadores.every(y=>y.cumplido);
  let racha=0;for(const x of d){if(perf(x))racha++;else break}
  const mejor=d.reduce((a,x)=>Math.max(a,x.puntos),0);
  let g='';
  if(i>=0&&rk.length>1){
    if(i===0){const dif=pts-rk[1].puntos;g=`<span class="ic">🏆</span><span><b>¡Vas de primero en esta tabla!</b><br><span class="mute">${dif>0?`Tienes ${dif} pts de ventaja. Cada día cumplido la cuida.`:'Estás empatado en la cima. Un día más cumplido te separa.'}</span></span>`}
    else{const dif=rk[i-1].puntos-pts;g=`<span class="ic">🎯</span><span><b>${dif>0?`A ${dif} pts de subir al puesto ${i}`:`Empatado con el puesto ${i}`}</b><br><span class="mute">${rk[i+1]?`Tu ventaja sobre el puesto ${i+2}: ${pts-rk[i+1].puntos} pts.`:'Cumplir tus indicadores de hoy te acerca.'}</span></span>`}
  }
  return (g?`<div class="card gap">${g}</div>`:'')+`<div class="stats"><div><b>${d.filter(perf).length}</b><span>Días perfectos</span></div><div><b>${racha}</b><span>Racha de días perfectos</span></div><div><b>${tot?Math.round(ok/tot*100):0}%</b><span>Indicadores cumplidos</span></div><div><b>${mejor}</b><span>Mejor día (pts)</span></div></div>`;
}
function podio(rk){
  if(!rk || rk.length<3)return '';
  const t=[rk[1],rk[0],rk[2]],pos=[2,1,3];
  return `<div class="podio">${t.map((x,k)=>`<div class="c p${pos[k]} ${x.yo?'yo':''}"><div class="nm">${esc(String(x.nombre||'').split(' ').slice(0,2).join(' '))}${x.yo?' (tú)':''}</div><div class="bl">${['🥈','🥇','🥉'][k]}<small>${x.puntos} pts</small></div></div>`).join('')}</div>`;
}

function renderDetalleIndicadorDia(ind){
  const pro = ind.promotores ?? ind.promotor ?? ind.positivos ?? null;
  const det = ind.detractores ?? ind.detractor ?? ind.negativos ?? null;
  const neu = ind.neutros ?? ind.neutro ?? null;
  const detTexto = ind.detalle || ind.observacion || ind.nota || null;

  const pills = [];
  if(pro !== null && pro !== undefined && pro !== '') pills.push(`<span class="pill-ind pro">👍 Promotores: <b>${esc(pro)}</b></span>`);
  if(det !== null && det !== undefined && det !== '') pills.push(`<span class="pill-ind det">👎 Detractores: <b>${esc(det)}</b></span>`);
  if(neu !== null && neu !== undefined && neu !== '') pills.push(`<span class="pill-ind">😐 Neutros: <b>${esc(neu)}</b></span>`);
  if(detTexto) pills.push(`<span class="pill-ind">${esc(detTexto)}</span>`);

  return pills.length ? `<div class="ind-meta">${pills.join('')}</div>` : '';
}

function dias(){
  const d=(H&&H.dias)||[];
  if(!d.length) return '<div class="card"><p class="mute" style="margin:0">Aún no hay resultados diarios cargados este mes.</p></div>';
  return d.map(x=>{
    const f=new Date(x.fecha+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
    const n=x.indicadores.length,c=x.indicadores.filter(i=>i.cumplido).length,pf=n>0&&c===n;
    const eq=x.eq_total?Math.round(x.eq_ok/x.eq_total*100):null,yo=n?Math.round(c/n*100):0,st=x.estrellas||[];
    return `<div class="card dia ${pf?'perf':''}"><div class="cab"><span><b>${esc(f)}</b><br><span class="big">${c}<small> de ${n} indicadores</small></span></span><span class="tot">+${x.puntos} pts${pf?'<br><span class="tag aprobada">⭐ Día perfecto</span>':''}</span></div>`
    +`<div class="seg" aria-hidden="true">${x.indicadores.map(i=>`<i class="${i.cumplido?'s':''}"></i>`).join('')}</div>`
    +(eq!=null?`<div class="cmp">Tú: ${yo}% · Equipo: ${eq}% ${yo>eq?'— por encima del equipo 👏':yo===eq?'— al ritmo del equipo':'— el equipo te saca ventaja, ¡mañana se recupera!'}</div>`:'')
    +x.indicadores.map(i=>`<div class="it"><div><span><b>${esc(i.nombre)}</b></span>${renderDetalleIndicadorDia(i)}</div><span class="${i.cumplido?'si':'no'}">${i.cumplido?'✔ Cumplió · +'+i.puntos+' pts':'✘ No cumplió · 0 pts'}</span></div>`).join('')
    +(st.length?`<div class="star">⭐ Día perfecto de: ${st.map(n=>n===D.nombre?'<b>tú</b>':esc(n)).join(', ')}</div>`:'')+'</div>';
  }).join('');
}

async function guardarInc(){

  const metaPts = $('#xm') ? Math.max(0, +$('#xm').value || 0) : 0;
  const indNombre = $('#x-ind-nom') ? $('#x-ind-nom').value.trim() : '';
  const metaInd = $('#x-ind-meta') ? $('#x-ind-meta').value.trim() : '';
  const corteInd = $('#x-ind-corte') ? ($('#x-ind-corte').value.trim() || 'Cierre de mes') : 'Cierre de mes';

  if(!nombre || !premio){ alert('Ingresa el nombre y el premio del incentivo'); return; }
  if(tipoMeta === 'indicador' && (!indNombre || !metaInd)){
    alert('Selecciona el indicador y define la meta del indicador');
    return;
  }
  if(tipoMeta === 'puntos' && metaPts <= 0){
    alert('Ingresa la meta de puntos');
    return;
  }

  const idActual = editIncId;
  saveMetaLocalIncentivo(idActual, nombre, tipoMeta, indNombre, metaInd, corteInd);
  editIncId = null;

  const payload = {
    ...(idActual ? {p_id: idActual} : {}),
    p_nombre: nombre, p_premio: premio,
    p_meta: tipoMeta === 'puntos' ? metaPts : 0,
    p_tipo_meta: tipoMeta,
    p_indicador_nombre: tipoMeta === 'indicador' ? indNombre : '',
    p_meta_indicador: tipoMeta === 'indicador' ? metaInd : '',
    p_corte_indicador: tipoMeta === 'indicador' ? corteInd : ''
  };

  try{
    await g('admin_incentivo', payload);
  }catch(e){
    await g('admin_incentivo', {
      ...(idActual ? {p_id: idActual} : {}),
      p_nombre: nombre, p_premio: premio, p_meta: tipoMeta === 'puntos' ? metaPts : 0
    });
  }
}

function resumenAsignacion(m){
  if(m.asignacion_tipo === 'algunos' && Array.isArray(m.asignados_cedulas) && m.asignados_cedulas.length){
    const nombres = m.asignados_cedulas.map(ced => {
      const u = ((D && D.usuarios) || []).find(x => String(x.cedula) === String(ced));
      return u ? corto(u.nombre) : ced;
    });
    return `Asignada a ${nombres.length} persona(s): ${nombres.join(', ')}`;
  }
  return 'Asignada a todos';
}

async function crearMision(){
  const titulo = $('#m-tit').value.trim();
  const descripcion = $('#m-desc').value.trim();
  const puntos = +$('#m-pts').value;
  const limite = $('#m-lim').value ? new Date($('#m-lim').value).toISOString() : null;
  const obligatoria = $('#m-oblig').checked;
  const asignacionTipo = $('#m-asig-tipo').value;
  const asignadosCedulas = asignacionTipo === 'algunos'
    ? Array.from(document.querySelectorAll('.m-asig-ced:checked')).map(el => String(el.value))
    : [];
  const insigniaIcono = ($('#m-ins-ico').value || '🏅').trim();
  const insigniaNombre = ($('#m-ins-nom').value || ('Insignia: ' + titulo)).trim();

  if(!titulo || !puntos){ alert('Ingresa el nombre de la misión y los puntos'); return; }
  if(asignacionTipo === 'algunos' && !asignadosCedulas.length){
    alert('Selecciona al menos una persona para asignar la misión');
    return;
  }

  saveMetaLocalMision(titulo, obligatoria, asignacionTipo, asignadosCedulas, insigniaNombre, insigniaIcono);

  try{
    await g('admin_crear_mision', {
      p_titulo: titulo, p_descripcion: descripcion, p_puntos: puntos, p_fecha_limite: limite,
      p_obligatoria: obligatoria, p_asignacion_tipo: asignacionTipo,
      p_asignados_cedulas: asignadosCedulas, p_insignia_nombre: insigniaNombre, p_insignia_icono: insigniaIcono
    });
  }catch(e){
    await g('admin_crear_mision', {
      p_titulo: titulo, p_descripcion: descripcion, p_puntos: puntos, p_fecha_limite: limite
    });
  }

  broadcastEvent('mision_publicada', {
    titulo, puntos, obligatoria, asignacion_tipo: asignacionTipo,
    asignados_cedulas: asignadosCedulas, insignia_nombre: insigniaNombre, insignia_icono: insigniaIcono
  });
  notify('🚀 Misión publicada en tiempo real', `Se alertó a los usuarios sobre "${titulo}".`, 'success', '', `pub-mis-${norm(titulo)}`);
}

async function aprobarMision(misionId){
  const ced = $('#m-usr-'+misionId).value;
  if(!ced) return;
  const res = resolverDatosUsuario(ced);
  await aprobarMisionDirecto(misionId, res.cedula, true, res.nombre);
}

async function aprobarMisionDirecto(misionId, ced, aprobar, nombreHint=''){
  const res = resolverDatosUsuario(ced, nombreHint);
  quitarPendienteLocalMision(misionId, res.cedula);
  MISIONES = enrichMisiones(MISIONES);
  await g('admin_aprobar_mision', {p_mision_id:misionId, p_ced:res.cedula, p_aprobar:aprobar});
  broadcastEvent('validacion_resuelta', {
    cedula: res.cedula, mision_id: misionId, aprobada: aprobar,
    mensaje: aprobar ? '¡Tu misión fue aprobada y recibiste tus puntos e insignia!' : 'Tu solicitud fue rechazada y la misión quedó cerrada.'
  });
  if(aprobar){
    notify('🏆 Aprobada: ' + res.nombre, `Se validó el cumplimiento de ${res.nombre} (CC ${res.cedula}).`, 'success', '', `apr-mis-${misionId}-${res.cedula}`);
  }else{
    notify('❌ Rechazada: ' + res.nombre, `Se rechazó la solicitud de ${res.nombre} (CC ${res.cedula}) y se cerró la misión.`, 'warn', '', `rej-mis-${misionId}-${res.cedula}`);
  }
}

async function agregarOpcionConducta(){
  const inp = $('#nueva-op-conducta');
  const nom = inp ? inp.value.trim() : '';
  if(!nom){ alert('Escribe el nombre de la opción de comportamiento'); return; }
  if(!OPCIONES_CONDUCTA.includes(nom)){
    OPCIONES_CONDUCTA = [...OPCIONES_CONDUCTA, nom];
    localStorage.setItem('opciones_conducta_local', JSON.stringify(OPCIONES_CONDUCTA));
  }
  try{
    await rpc('admin_crear_opcion_conducta', {p_admin: S.clave, p_nombre: nom});
  }catch(e){}
  notify('✔ Opción agregada', `"${nom}" ya está disponible para reportes de conducta.`, 'success');
  drawAdmin();
}

async function borrarOpcionConducta(nombre){
  if(OPCIONES_CONDUCTA.length <= 1){
    alert('Debe quedar al menos una opción de comportamiento');
    return;
  }
  OPCIONES_CONDUCTA = OPCIONES_CONDUCTA.filter(x => x !== nombre);
  localStorage.setItem('opciones_conducta_local', JSON.stringify(OPCIONES_CONDUCTA));
  try{
    await rpc('admin_borrar_opcion_conducta', {p_admin: S.clave, p_nombre: nombre});
  }catch(e){}
  drawAdmin();
}
